<style>
/* Same layout as Slang Clip Note (JAPANESE IDOL STUDY): top page, then one phrase at a time — video stage, the lines, word list; a Learn/Quiz switch above.
   The page itself is in the learner's language (html lang); every piece of Japanese is marked lang="ja". */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --ink:#1b1f2e; --muted:#636878; --line:#e3e0d8;
  --accent:#d2452b; --on-accent:#ffffff; --ai:#24407c; --stage:#17223f; --stage-ink:#eef1ff;
  --hl:#ffe27a; --hl-ink:#1b1f2e; --bub-a:#eaeef8; --bub-b:#fde9e3; --ok:#1b8455; --ng:#cc3434;
  --en:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141c; --surface:#1a1f2b; --ink:#eceef4; --muted:#9ea4b6; --line:#2d3342;
  --accent:#ff7a5c; --on-accent:#230a04; --ai:#9fb6ff; --stage:#0b0f1a; --stage-ink:#e3e8ff;
  --hl:#6a5414; --hl-ink:#fff4c9; --bub-a:#232a3c; --bub-b:#3a2420; --ok:#4cc38a; --ng:#ff7d7d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#1a1f2b; --ink:#eceef4; --muted:#9ea4b6; --line:#2d3342;
  --accent:#ff7a5c; --on-accent:#230a04; --ai:#9fb6ff; --stage:#0b0f1a; --stage-ink:#e3e8ff;
  --hl:#6a5414; --hl-ink:#fff4c9; --bub-a:#232a3c; --bub-b:#3a2420; --ok:#4cc38a; --ng:#ff7d7d; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.75}
:lang(ja){font-family:var(--ja)}
:lang(hi){font-family:"Noto Sans Devanagari",var(--ui)}
:lang(th){font-family:"Noto Sans Thai",var(--ui)}
:lang(zh-Hant){font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",var(--ui)}
:lang(zh-Hans){font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",var(--ui)}
:lang(vi){font-family:var(--ui)}
:lang(ko){font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",var(--ui)}
:lang(ar){font-family:"Noto Sans Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif}
/* Arabic turns the page right-to-left; Japanese, romaji and the brand stay left-to-right */
[dir="rtl"] [lang="ja"],[dir="rtl"] .ro,[dir="rtl"] .htitle,[dir="rtl"] .tlogo,[dir="rtl"] .brand h1,[dir="rtl"] .kicker,[dir="rtl"] .qhead .tag{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .opt,[dir="rtl"] .sheet .box{text-align:right}
[dir="rtl"] .sheet ol{padding-left:0;padding-right:1.3em}
[dir="rtl"] .top::after{right:auto;left:-.08em}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

ruby rt{font-size:.5em;color:var(--muted);font-weight:400;letter-spacing:0}
body.nofuri rt{display:none}
body.noro .ro{display:none}

header{display:flex;flex-direction:column;gap:12px}
.brand h1{font-family:var(--ja);font-weight:700;font-size:1.9rem;line-height:1.2;margin:0;letter-spacing:.02em;cursor:pointer}
.brand h1 span{color:var(--accent)}
.beta{font-family:var(--en);font-style:normal;font-size:.75rem;font-weight:700;vertical-align:middle;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 10px;margin-left:6px;letter-spacing:.06em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .seg{margin-left:auto}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer}
.langpick{display:inline-flex;align-items:center;gap:6px}
.langpick span{font-family:var(--en);font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer}
.tog[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);font-weight:700}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 18px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--surface)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700}
.chip i{font-style:normal;font-family:var(--en);font-size:.72rem;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bub-a);color:var(--ai);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chip[aria-pressed="true"] i{background:var(--accent);color:var(--on-accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stage{position:relative;background:var(--stage);color:var(--stage-ink);aspect-ratio:16/9;max-width:100%;display:grid}
.stage video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.empty{padding:18px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.empty .lab{font-size:.72rem;letter-spacing:.12em;opacity:.75;font-weight:700}
.empty h3{margin:0;font-size:1.02rem}
.script{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.script b{display:inline-block;width:1.6em;color:var(--hl);font-family:var(--en)}
.pick{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid currentColor;border-radius:999px;padding:4px 14px;font-size:.85rem;cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:.78rem;opacity:.8;margin:0}

.body{padding:20px;display:flex;flex-direction:column;gap:18px}
.tag{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.phrase{display:flex;flex-direction:column;gap:2px}
.phrase .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phrase h2{font-weight:700;font-size:clamp(2rem,7vw,2.7rem);line-height:1.35;margin:0;text-wrap:balance}
.phrase .ro{font-family:var(--en);color:var(--muted);font-size:1rem}
.phrase .mean{font-size:1.15rem;font-weight:700;color:var(--ai)}
.phrase .scene{display:inline-block;margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.nuance{margin:0;color:var(--muted);max-width:62ch}

.say{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 9px;font-size:.8rem;cursor:pointer;line-height:1.8}
.chat{display:flex;flex-direction:column;gap:12px}
.line{display:flex;gap:10px;align-items:flex-start;max-width:94%}
.line.b{flex-direction:row-reverse;align-self:flex-end}
.who{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:.85rem;background:var(--ai);color:var(--surface)}
.line.b .who{background:var(--accent);color:var(--on-accent)}
.bub{background:var(--bub-a);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.line.b .bub{background:var(--bub-b)}
.jp{font-size:1.3rem;font-weight:700;line-height:2;margin:0}
.ro{margin:0;font-family:var(--en);font-size:.85rem;color:var(--muted)}
.w{background:none;border:0;padding:0 1px;cursor:pointer;border-radius:4px;border-bottom:2px dotted var(--ai);font-weight:inherit;line-height:inherit}
.w.slang{background:var(--hl);color:var(--hl-ink);border-bottom:0;padding:0 4px}
.w.on{outline:2px solid var(--accent)}
.tr{margin:0;font-size:.95rem;color:var(--ink)}
.tr.hid{cursor:pointer;color:var(--muted)}
.tr.hid.hide{filter:blur(5px);user-select:none}
.chat.solo .line{max-width:100%}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 10px;font-size:.78rem;cursor:pointer}
.examples{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--bg);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.ex .jp{font-size:1.12rem}
.exw{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.exw b{color:var(--ink);margin-right:4px}
.pop{min-height:3.2em;border-radius:12px;background:var(--bg);padding:10px 14px;font-size:.95rem;color:var(--muted)}
.pop b{color:var(--ink);font-size:1.1rem;margin-right:6px}
.pop small{border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;padding:8px 18px}
.btn:disabled{opacity:.45;cursor:default}

.words{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
td.wd{white-space:nowrap}
td.wd b{font-size:1.02rem}
td.wd small{display:block;color:var(--muted);font-size:.75rem}
td.pos{color:var(--muted);font-size:.78rem;white-space:nowrap}
.tip{background:var(--bub-a);border-radius:14px;padding:12px 16px}
.tip p{margin:2px 0 0}
.nav{display:flex;justify-content:space-between;gap:8px}

/* edit mode (?edit): line timings for the owner */
.admin{padding:14px 16px;border:1px dashed var(--ai);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.help{margin:0;font-size:.85rem}
.admin textarea{width:100%;box-sizing:border-box;min-height:7em;font:12px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)}
.timing{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.timing b{color:var(--ink);font-variant-numeric:tabular-nums}
.timing button{border:1px solid var(--ai);color:var(--ai);background:var(--surface);border-radius:999px;padding:0 10px;cursor:pointer}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:1.1rem;font-weight:700;margin:0}
.qbig{font-weight:700;font-size:2.3rem;line-height:1.5;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-width:0}
.opt.ja{font-weight:700;font-size:1.1rem}
.opt:hover:not(:disabled){border-color:var(--ai)}
.opt.right{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.opt.wrong{border-color:var(--ng);box-shadow:0 0 0 1px var(--ng) inset}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 16px;background:var(--bg)}
.fb strong.ok{color:var(--ok)} .fb strong.ng{color:var(--ng)}
.result{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.score{font-family:var(--en);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.2rem;color:var(--muted)}
.miss{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;width:100%}
.miss li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.miss span{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- top page ---------- */
.top{position:relative;min-height:100svh;background:#0f1630;color:#f2f4ff;overflow:hidden;display:flex;flex-direction:column}
/* background clip: a band at the top showing the whole picture width (56.6vw = the clip's 640:362 shape), fading into the page.
   The MP4 has black bars baked in (picture = 362 of 480 rows), so the video is drawn 132.6% tall and centred to crop them. */
.top .bgwrap{position:absolute;top:0;left:0;width:100%;height:min(100svh,56.6vw);overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.top .bgv{position:absolute;left:0;top:-16.3%;width:100%;height:132.6%;object-fit:cover;object-position:50% 50%;opacity:.55}
/* phones: the clip is not a background any more — a framed video under the logo, whole picture, full colour, no text on top */
@media (max-width:640px){
  .top > *{order:3}
  .top .tbar{order:0}
  .top .bgwrap{order:1;position:relative;height:auto;width:auto;aspect-ratio:640/362;margin:0 20px;border-radius:16px;-webkit-mask-image:none;mask-image:none;box-shadow:0 12px 30px -12px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.18)}
  .top .bgv{opacity:1}
  .top .hero{order:2;padding-top:20px}
}
.top::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 80% at 85% 10%,rgba(210,69,43,.5),transparent 55%),
  radial-gradient(90% 70% at 0% 100%,rgba(52,90,190,.6),transparent 60%),
  linear-gradient(180deg,rgba(15,22,48,.3) 0%,rgba(15,22,48,.55) 45%,#0f1630 100%);z-index:1}
.top::after{content:"日本語";position:absolute;right:-.08em;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:var(--ja);font-weight:700;font-size:min(34vw,16rem);line-height:1;color:rgba(255,255,255,.05);z-index:1;pointer-events:none}
.top > *{position:relative;z-index:2}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;max-width:1080px;width:100%;margin:0 auto;box-sizing:border-box}
.tlogo{font-family:var(--en);font-weight:800;font-size:clamp(.82rem,3.6vw,1.05rem);letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tpill{white-space:nowrap}
.tlogo i{width:26px;height:26px;border-radius:8px;background:#d2452b;display:grid;place-items:center;font-style:normal;font-family:var(--ja);font-size:.85rem}
.tpill{font-family:var(--en);font-size:.72rem;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;letter-spacing:.08em}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:16px 20px 36px;max-width:1080px;width:100%;margin:0 auto;box-sizing:border-box}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.2em;color:#ffb8a6;font-family:var(--en)}
.kicker span{font-family:var(--ja);letter-spacing:.1em}
.htitle{font-family:var(--en);font-weight:800;font-size:clamp(3rem,13vw,7.5rem);line-height:.9;letter-spacing:-.045em;margin:0}
.htitle span{display:block}
.htitle .c{color:transparent;background:linear-gradient(95deg,#ff6a4d,#ffd36e);-webkit-background-clip:text;background-clip:text}
.hlead{font-size:clamp(1.05rem,3.6vw,1.35rem);font-weight:700;margin:0;max-width:32em;line-height:1.6}
.hlead small{display:block;font-weight:400;font-size:.88em;color:#cdd3ee;margin-top:4px}
.langs{display:flex;flex-direction:column;gap:8px}
.langs > span{font-size:.75rem;color:#cdd3ee;font-weight:700;letter-spacing:.06em}
.langs div{display:flex;flex-wrap:wrap;gap:8px}
.lg{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.lg[aria-pressed="true"]{background:#fff;color:#0f1630;border-color:#fff;font-weight:700}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta button{font:inherit;font-weight:700;border-radius:999px;padding:14px 28px;font-size:1.02rem;cursor:pointer;border:0;transition:transform .15s}
.cta button:hover{transform:translateY(-2px)}
.cta .go{background:#d2452b;color:#fff;box-shadow:0 10px 30px -8px rgba(210,69,43,.8)}
.cta .ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px;align-items:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--en);font-size:1.9rem;font-weight:800;line-height:1}
.stats span{font-size:.75rem;color:#cdd3ee;margin-top:4px}
.ticker{overflow:hidden;border-block:1px solid rgba(255,255,255,.14);background:rgba(15,22,48,.6);padding:14px 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .track{display:flex;gap:12px;width:max-content;animation:tick 40s linear infinite}
.ticker:hover .track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk{flex:none;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 16px 8px 8px;cursor:pointer;font:inherit}
.tk i{font-style:normal;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-family:var(--en);font-size:.75rem;font-weight:700}
.tk.v i{background:#d2452b}
.tk b{font-weight:700}
.tk small{color:#cdd3ee;font-size:.78rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:34px 20px 44px;max-width:1080px;width:100%;margin:0 auto;box-sizing:border-box}
@media (max-width:640px){.how{grid-template-columns:1fr}}
.how div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px}
.how em{font-style:normal;font-family:var(--en);font-weight:800;font-size:.8rem;color:#ff9c86;letter-spacing:.16em}
.how h3{margin:6px 0 4px;font-size:1.1rem}
.how p{margin:0;font-size:.88rem;color:#cdd3ee}
.tfoot{text-align:center;font-size:.75rem;color:#98a1c8;padding:0 20px 28px}

 "At work, in clubs, or after finishing something together":["Au travail, dans un club, ou après avoir fini quelque chose ensemble","No trabalho, em clubes ou depois de terminar algo juntos","En el trabajo, en clubes o después de terminar algo juntos"],
 "The all-purpose workplace greeting. Use it when passing coworkers in the hall, at the start of emails, or when leaving for the day.":["La salutation passe-partout au bureau. On l'utilise en croisant un collègue dans le couloir, au début d'un e-mail ou en partant le soir.","O cumprimento coringa do trabalho. Use ao cruzar com colegas no corredor, no começo de e-mails ou ao ir embora.","El saludo comodín del trabajo. Se usa al cruzarse con compañeros en el pasillo, al empezar un correo o al irse a casa."],
 "With friends, just say お疲れ! When leaving before others: お先に失礼します.":["Entre amis, dites simplement お疲れ! Si vous partez avant les autres : お先に失礼します.","Com amigos, diga só お疲れ! Ao sair antes dos outros: お先に失礼します.","Con amigos, basta con お疲れ! Si te vas antes que los demás: お先に失礼します."],
 "The meeting is over.":["La réunion est terminée.","A reunião terminou.","La reunión terminó."],

 "Nice to meet you / I'm counting on you":["Enchanté / Je compte sur vous","Muito prazer / Conto com você","Mucho gusto / Cuento contigo"],
 "Introducing yourself, or asking someone for a favor":["Pour se présenter, ou demander un service","Ao se apresentar ou pedir um favor","Al presentarte o al pedir un favor"],
 "There's no exact English match. It asks for a good relationship from now on. Used at the end of self-introductions, requests and emails.":["Pas d'équivalent exact en français. On souhaite une bonne relation à partir de maintenant. S'emploie à la fin d'une présentation, d'une demande ou d'un e-mail.","Não há equivalente exato em português. Expressa o desejo de uma boa relação daqui em diante. Usado no fim de apresentações, pedidos e e-mails.","No tiene equivalente exacto en español. Expresa el deseo de una buena relación a partir de ahora. Se usa al final de presentaciones, peticiones y correos."],
 "Casual: よろしく! Very polite: よろしくお願いいたします.":["Familier : よろしく! Très poli : よろしくお願いいたします.","Informal: よろしく! Muito educado: よろしくお願いいたします.","Informal: よろしく! Muy formal: よろしくお願いいたします."],

 "this year":["cette année","este ano","este año"],
 "Um, that's a bit… (a soft 'no')":["Euh, c'est un peu… (un « non » poli)","Hum, é que… (um “não” educado)","Mmm, es que… (un “no” suave)"],
 "Politely turning down an invitation":["Pour refuser poliment une invitation","Ao recusar um convite com educação","Para rechazar una invitación con cortesía"],
 "ちょっと means 'a little', but trailing off with ちょっと… is a polite 'no'. Japanese often avoids a direct いいえ — leaving the sentence unfinished is the point.":["ちょっと veut dire « un peu », mais laisser la phrase en suspens avec ちょっと… est un « non » poli. Le japonais évite souvent un いいえ direct : c'est justement la phrase inachevée qui compte.","ちょっと significa “um pouco”, mas deixar a frase no ar com ちょっと… é um “não” educado. Em japonês se evita um いいえ direto; o importante é justamente não terminar a frase.","ちょっと significa “un poco”, pero dejar la frase en el aire con ちょっと… es un “no” cortés. En japonés se suele evitar un いいえ directo; lo importante es justamente no terminar la frase."],
 "If someone says ちょっと… to you, don't push. It almost always means no.":["Si quelqu'un vous répond ちょっと…, n'insistez pas. Cela veut presque toujours dire non.","Se alguém disser ちょっと… para você, não insista. Quase sempre significa não.","Si alguien te dice ちょっと…, no insistas. Casi siempre significa que no."],

 "Declining an offer in a shop, or saying you're OK":["Pour refuser une offre en magasin, ou dire que tout va bien","Ao recusar algo em uma loja, ou para dizer que está tudo bem","Para rechazar algo en una tienda, o decir que estás bien"],
 "Literally 'safe, OK'. In shops, answering 'Do you need a bag?' with 大丈夫です means 'No thanks'. It confuses even Japanese people — gestures and tone help.":["Littéralement « sans danger, OK ». En magasin, répondre 大丈夫です à « Voulez-vous un sac ? » veut dire « Non merci ». Même les Japonais s'y perdent : les gestes et le ton aident.","Literalmente “seguro, ok”. Na loja, responder 大丈夫です a “Quer uma sacola?” significa “Não, obrigado”. Até os japoneses se confundem; gestos e tom de voz ajudam.","Literalmente “seguro, está bien”. En una tienda, responder 大丈夫です a “¿Quiere una bolsa?” significa “No, gracias”. Hasta los japoneses se confunden; los gestos y el tono ayudan."],
 "Add a small wave of the hand to make 'No thanks' clear.":["Faites un petit signe de la main pour que le « non merci » soit clair.","Faça um leve aceno com a mão para deixar claro o “não, obrigado”.","Haz un pequeño gesto con la mano para que el “no, gracias” quede claro."],

 "Excuse me / Sorry / Thank you":["Excusez-moi / Pardon / Merci","Com licença / Desculpe / Obrigado","Disculpe / Perdón / Gracias"],
 "Calling staff, apologizing, or thanking someone":["Pour appeler le personnel, s'excuser ou remercier","Para chamar atendentes, pedir desculpas ou agradecer","Para llamar al personal, disculparte o dar las gracias"],
 "One word, three jobs: getting attention (in restaurants), a light apology, and a thank-you when someone goes out of their way for you.":["Un mot, trois usages : attirer l'attention (au restaurant), s'excuser légèrement, et remercier quelqu'un qui s'est donné du mal pour vous.","Uma palavra, três usos: chamar a atenção (em restaurantes), pedir desculpas de leve e agradecer quando alguém se esforça por você.","Una palabra, tres usos: llamar la atención (en restaurantes), disculparse un poco y agradecer cuando alguien se toma una molestia por ti."],
 "In restaurants, raise your hand and say すみません! clearly — staff usually won't come unless called.":["Au restaurant, levez la main et dites すみません! distinctement : en général, le personnel ne vient pas si on ne l'appelle pas.","Em restaurantes, levante a mão e diga すみません! com clareza; geralmente os atendentes só vêm se você chamar.","En los restaurantes, levanta la mano y di すみません! con claridad; normalmente el personal no viene si no lo llamas."],

 "Shows you understood and agree with the logic. Great for keeping a conversation going.":["Montre que vous avez compris et que vous suivez le raisonnement. Idéal pour relancer la conversation.","Mostra que você entendeu e concorda com a lógica. Ótimo para manter a conversa fluindo.","Muestra que entendiste y que estás de acuerdo con la lógica. Ideal para mantener la conversación."],
 "Careful: なるほど can sound a little casual to a boss or teacher. そうなんですね is safer.":["Attention : なるほど peut paraître un peu familier face à un supérieur ou un professeur. そうなんですね est plus sûr.","Cuidado: なるほど pode soar um pouco informal com um chefe ou professor. そうなんですね é mais seguro.","Cuidado: なるほど puede sonar algo informal con un jefe o un profesor. そうなんですね es más seguro."],

 "I learned something":["j'ai appris quelque chose","aprendi algo","aprendí algo"],
 "Meh / So-so / Hard to say":["Bof / Moyen / Difficile à dire","Mais ou menos / Meio assim / Difícil dizer","Regular / Más o menos / Difícil de decir"],
 "Giving a not-so-positive opinion softly":["Pour donner un avis peu positif en douceur","Para dar uma opinião não muito positiva de forma suave","Para dar una opinión poco positiva con suavidad"],
 "The dictionary meaning is 'subtle', but in conversation it's a soft way to say 'not great'. Popular because it doesn't sound harsh.":["Le sens du dictionnaire est « subtil », mais à l'oral c'est une façon douce de dire « pas terrible ». Très utilisé parce que ça ne sonne pas dur.","O sentido de dicionário é “sutil”, mas na conversa é um jeito suave de dizer “não muito bom”. É popular porque não soa grosseiro.","El significado de diccionario es “sutil”, pero en la conversación es una forma suave de decir “no muy bueno”. Es popular porque no suena duro."],

 "どこ on its own is a casual 'Where?'. Add ですか to make it polite: どこですか？ The pattern [thing]はどこですか？ means 'Where is [thing]?'.":["どこ seul est un « Où ? » familier. Ajoutez ですか pour être poli : どこですか？ La structure [objet]はどこですか？ veut dire « Où est [objet] ? ».","どこ sozinho é um “Onde?” informal. Acrescente ですか para ficar educado: どこですか？ A estrutura [coisa]はどこですか？ significa “Onde fica [coisa]?”.","どこ solo es un “¿Dónde?” informal. Añade ですか para que sea formal: どこですか？ La estructura [cosa]はどこですか？ significa “¿Dónde está [cosa]?”."],
 "A lifesaver when you're lost: トイレはどこですか？ (Where's the toilet?) Point at a map while asking and it's even clearer.":["Indispensable quand on est perdu : トイレはどこですか？ (Où sont les toilettes ?) Montrez une carte en même temps, c'est encore plus clair.","Salva-vidas quando você se perde: トイレはどこですか？ (Onde fica o banheiro?) Aponte para um mapa enquanto pergunta e fica ainda mais claro.","Te salva cuando te pierdes: トイレはどこですか？ (¿Dónde está el baño?) Si señalas un mapa mientras preguntas, queda aún más claro."],

 "High, tall / Low, short":["Haut, grand / Bas, petit","Alto / Baixo","Alto / Bajo"],
 "Talking about height, prices or levels":["Pour parler de hauteur, de prix ou de niveau","Para falar de altura, preços ou níveis","Para hablar de altura, precios o niveles"],
 "Both are い-adjectives. 高い means 'high / tall', and for prices it means 'expensive'. Careful: the opposite of 'expensive' is 安い (cheap), not 低い.":["Ce sont deux adjectifs en い. 高い veut dire « haut / grand » et, pour un prix, « cher ». Attention : le contraire de « cher » est 安い (bon marché), pas 低い.","Os dois são adjetivos em い. 高い significa “alto” e, para preços, “caro”. Cuidado: o contrário de “caro” é 安い (barato), não 低い.","Los dos son adjetivos en い. 高い significa “alto” y, con precios, “caro”. Cuidado: lo contrario de “caro” es 安い (barato), no 低い."],
 "For a person's height, say 背が高い (tall) / 背が低い (short).":["Pour la taille d'une personne, dites 背が高い (grand) / 背が低い (petit).","Para a altura de uma pessoa, diga 背が高い (alto) / 背が低い (baixo).","Para la estatura de una persona, di 背が高い (alto) / 背が低い (bajo)."],

 "いつ alone is a casual 'When?'. Add ですか to make it polite: いつですか？ The usual pattern is [thing]はいつですか？ = 'When is [thing]?'.":["いつ seul est un « Quand ? » familier. Ajoutez ですか pour être poli : いつですか？ La structure courante est [chose]はいつですか？ = « Quand est [chose] ? ».","いつ sozinho é um “Quando?” informal. Acrescente ですか para ficar educado: いつですか？ A estrutura mais comum é [coisa]はいつですか？ = “Quando é [coisa]?”.","いつ solo es un “¿Cuándo?” informal. Añade ですか para que sea formal: いつですか？ La estructura habitual es [cosa]はいつですか？ = “¿Cuándo es [cosa]?”."],

 "ごめん is the casual 'sorry'; adding ね makes it softer and friendlier. 遅れて来て means 'coming late' (遅れる 'be late' + 来る 'come'). With teachers or at work, say 遅れてすみません instead.":["ごめん est le « pardon » familier ; ajouter ね le rend plus doux et amical. 遅れて来て veut dire « arriver en retard » (遅れる « être en retard » + 来る « venir »). Avec un professeur ou au travail, dites plutôt 遅れてすみません.","ごめん é o “desculpa” informal; acrescentar ね deixa mais suave e simpático. 遅れて来て significa “chegar atrasado” (遅れる “atrasar” + 来る “vir”). Com professores ou no trabalho, diga 遅れてすみません.","ごめん es el “perdón” informal; añadir ね lo hace más suave y cercano. 遅れて来て significa “llegar tarde” (遅れる “retrasarse” + 来る “venir”). Con profesores o en el trabajo, di mejor 遅れてすみません."],
 "Politeness ladder: ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (most formal).":["Du plus familier au plus poli : ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (le plus formel).","Do mais informal ao mais educado: ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (o mais formal).","De lo más informal a lo más formal: ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (lo más formal)."],

 "溶ける means 'to melt'. Drop る and add そう (溶けそう) to say it looks like it's about to happen. The same pattern works for many verbs: 雨が降りそう (It looks like rain), 泣きそう (I'm about to cry).":["溶ける veut dire « fondre ». Enlevez る et ajoutez そう (溶けそう) pour dire que ça semble sur le point d'arriver. La même structure marche avec beaucoup de verbes : 雨が降りそう (On dirait qu'il va pleuvoir), 泣きそう (Je vais pleurer).","溶ける significa “derreter”. Tire o る e acrescente そう (溶けそう) para dizer que algo parece prestes a acontecer. O mesmo padrão serve para muitos verbos: 雨が降りそう (Parece que vai chover), 泣きそう (Vou chorar).","溶ける significa “derretirse”. Quita る y añade そう (溶けそう) para decir que algo parece a punto de pasar. La misma estructura sirve con muchos verbos: 雨が降りそう (Parece que va a llover), 泣きそう (Estoy a punto de llorar)."],

 "Literally 'I humbly receive.' It thanks the people who made the food and the lives in it. Japanese people say it even when eating alone.":["직역하면 '겸손히 받겠습니다'예요. 음식을 만든 사람과 음식이 된 생명에게 감사하는 말이에요. 일본 사람들은 혼자 먹을 때도 말해요.","معناها الحرفي «أتلقّى بتواضع». هي شكر لمن أعدّ الطعام وللأرواح التي فيه. يقولها اليابانيون حتى عندما يأكلون وحدهم."],
 "Put your hands together and bow slightly. After eating, say ごちそうさまでした.":["두 손을 모으고 살짝 고개를 숙여요. 다 먹은 후에는 ごちそうさまでした라고 말해요.","اضمم يديك وانحنِ قليلًا. وبعد الأكل قل ごちそうさまでした."],
 "Here, go ahead and eat.":["자, 어서 먹어.","تفضّل، كُل."],
 "Wow, looks delicious! Thank you for the food!":["와, 맛있겠다! 잘 먹겠습니다!","واو، يبدو لذيذًا! شكرًا على الطعام!"],
 "please, go ahead":["자, 어서 (권유)","تفضّل"],
 "eat (request form of 食べる)":["먹어 (食べる의 부탁형)","كُل (صيغة الطلب من 食べる)"],
 "wow":["와","واو"],
 "looks delicious":["맛있어 보인다","يبدو لذيذًا"],
 "All together: thank you for the food!":["다 같이: 잘 먹겠습니다!","معًا: شكرًا على الطعام!"],
 "all together":["다 같이","جميعًا معًا"],
 "Hands together — itadakimasu.":["두 손을 모으고, 이타다키마스.","اليدان مضمومتان: إيتاداكيماس."],
 "hand":["손","يد"],
 "put together (て form of 合わせる)":["모으다 (合わせる의 て형)","ضمّ (صيغة て من 合わせる)"],
 "Thanks for your hard work (greeting)":["수고하셨습니다 (인사)","شكرًا على مجهودك (تحية)"],
 "At work, in clubs, or after finishing something together":["회사나 동아리에서, 또는 함께 일을 끝낸 후에","في العمل أو النوادي، أو بعد إنهاء عمل معًا"],
 "The all-purpose workplace greeting. Use it when passing coworkers in the hall, at the start of emails, or when leaving for the day.":["직장에서 두루 쓰는 인사예요. 복도에서 동료를 만났을 때, 이메일 첫머리, 퇴근할 때 써요.","تحية العمل لكل المناسبات. تُقال عند مقابلة الزملاء في الممر، وفي بداية الرسائل الإلكترونية، وعند المغادرة."],
 "With friends, just say お疲れ! When leaving before others: お先に失礼します.":["친구끼리는 お疲れ! 라고만 해요. 남보다 먼저 퇴근할 때는 お先に失礼します.","مع الأصدقاء قل فقط お疲れ! وعند المغادرة قبل الآخرين: お先に失礼します."],
 "The meeting is over.":["회의 끝났습니다.","انتهى الاجتماع."],
 "Thanks for your hard work!":["수고하셨습니다!","شكرًا على مجهودك!"],
 "meeting":["회의","اجتماع"],
 "has finished (polite past of 終わる)":["끝났습니다 (終わる의 정중한 과거형)","انتهى (الماضي المهذب من 終わる)"],
 "Thanks for today. I'll be heading out first.":["오늘 수고하셨습니다. 먼저 들어가 보겠습니다.","شكرًا على اليوم. سأغادر أولًا."],
 "excuse me for leaving first":["먼저 실례하겠습니다","اعذروني على المغادرة أولًا"],
 "Good job today, too!":["오늘도 수고했어!","أحسنت اليوم أيضًا!"],
 "today":["오늘","اليوم"],
 "also, too":["~도","أيضًا"],
 "Nice to meet you / I'm counting on you":["잘 부탁드립니다 / 부탁해요","تشرفنا / أعتمد عليك"],
 "Introducing yourself, or asking someone for a favor":["자기소개를 할 때, 또는 부탁할 때","عند تقديم نفسك أو طلب خدمة"],
 "There's no exact English match. It asks for a good relationship from now on. Used at the end of self-introductions, requests and emails.":["한국어의 '잘 부탁드립니다'와 거의 같아요. 앞으로 좋은 관계를 부탁하는 말이에요. 자기소개, 부탁, 이메일 끝에 써요.","لا يوجد مقابل دقيق لها في العربية. معناها طلب علاقة طيبة من الآن فصاعدًا. تُقال في نهاية التعريف بالنفس والطلبات والرسائل."],
 "Casual: よろしく! Very polite: よろしくお願いいたします.":["편하게: よろしく! 아주 정중하게: よろしくお願いいたします.","غير رسمي: よろしく! مهذب جدًا: よろしくお願いいたします."],
 "Nice to meet you. I'm Lee.":["처음 뵙겠습니다. 리입니다.","تشرفنا. أنا لي."],
 "I look forward to getting to know you.":["잘 부탁드립니다.","يسعدني التعرّف إليكم."],
 "nice to meet you (first meeting)":["처음 뵙겠습니다 (첫 만남)","تشرفنا (أول لقاء)"],
 "am / is (polite)":["~입니다 (정중)","يكون / هو (مهذب)"],
 "Could you please take care of this?":["이거 잘 부탁드려요.","هل يمكنك الاهتمام بهذا من فضلك؟"],
 "this (thing)":["이것","هذا (الشيء)"],
 "Here's to another good year together!":["올해도 잘 부탁해!","لنقضِ عامًا جميلًا آخر معًا!"],
 "this year":["올해","هذا العام"],
 "Um, that's a bit… (a soft 'no')":["음, 그건 좀… (부드러운 거절)","امم، هذا صعب قليلًا… («لا» بلطف)"],
 "Politely turning down an invitation":["초대를 정중하게 거절할 때","عند رفض دعوة بلطف"],
 "ちょっと means 'a little', but trailing off with ちょっと… is a polite 'no'. Japanese often avoids a direct いいえ — leaving the sentence unfinished is the point.":["ちょっと는 '조금'이라는 뜻이지만, ちょっと…처럼 말끝을 흐리면 정중한 거절이에요. 일본어에서는 직접적인 いいえ를 피하는 경우가 많아요. 문장을 끝맺지 않는 것이 핵심이에요.","ちょっと تعني «قليلًا»، لكن ترك الجملة معلّقة بـ ちょっと… هو «لا» مهذبة. كثيرًا ما يتجنب اليابانيون قول いいえ مباشرة، والمهم هو عدم إكمال الجملة."],
 "If someone says ちょっと… to you, don't push. It almost always means no.":["상대가 ちょっと…라고 하면 더 조르지 마세요. 거의 항상 거절이라는 뜻이에요.","إذا قال لك أحد ちょっと… فلا تُلحّ. فهي تعني «لا» في أغلب الأحيان."],
 "Want to go for drinks tonight?":["오늘 밤 한잔하러 갈래?","هل نخرج لنشرب شيئًا الليلة؟"],
 "Tonight's a bit… (difficult).":["오늘 밤은 좀… (어려워).","الليلة صعب قليلًا…"],
 "tonight":["오늘 밤","الليلة"],
 "(go) for drinks":["(술) 마시러","(الذهاب) للشرب"],
 "won't you go? (casual invitation)":["안 갈래? (편한 권유)","ألا تذهب؟ (دعوة غير رسمية)"],
 "as for… (topic marker)":["~은/는 (주제 조사)","أما… (أداة الموضوع)"],
 "Sunday is a bit… (not good).":["일요일은 좀… (안 돼).","يوم الأحد صعب قليلًا…"],
 "Sunday":["일요일","الأحد"],
 "Wait a sec!":["잠깐만!","انتظر لحظة!"],
 "wait (request form of 待つ)":["기다려 (待つ의 부탁형)","انتظر (صيغة الطلب من 待つ)"],
 "I'm fine / No, thank you":["괜찮아요 / 아니요, 됐어요","أنا بخير / لا، شكرًا"],
 "Declining an offer in a shop, or saying you're OK":["가게에서 거절할 때, 또는 괜찮다고 말할 때","عند رفض عرض في متجر، أو للقول إنك بخير"],
 "Literally 'safe, OK'. In shops, answering 'Do you need a bag?' with 大丈夫です means 'No thanks'. It confuses even Japanese people — gestures and tone help.":["직역하면 '안전하다, 괜찮다'예요. 가게에서 '봉투 필요하세요?'에 大丈夫です라고 하면 '괜찮아요(필요 없어요)'라는 뜻이에요. 일본 사람도 헷갈리니 손짓과 말투가 도움이 돼요.","معناها الحرفي «آمن، لا بأس». في المتجر، الرد على «هل تريد كيسًا؟» بـ 大丈夫です يعني «لا، شكرًا». حتى اليابانيون يرتبكون، والإشارات ونبرة الصوت تساعد."],
 "Add a small wave of the hand to make 'No thanks' clear.":["손을 살짝 저으면 '괜찮아요'라는 뜻이 분명해져요.","حرّك يدك قليلًا ليتضح أنك تقصد «لا، شكرًا»."],
 "Would you like a bag?":["봉투 필요하세요?","هل تريد كيسًا؟"],
 "Oh, no thank you.":["아, 괜찮아요.","آه، لا شكرًا."],
 "bag":["봉투, 가방","كيس، حقيبة"],
 "would you like (to use)…? (polite, in shops)":["~ 이용하시겠어요? (가게에서 쓰는 정중한 말)","هل ترغب في…؟ (مهذب، في المتاجر)"],
 "oh":["아","آه"],
 "Are you OK?":["괜찮아?","هل أنت بخير؟"],
 "It's totally fine.":["전혀 괜찮아요.","لا مشكلة على الإطلاق."],
 "totally; (not) at all":["전혀, 완전히","تمامًا؛ (ليس) إطلاقًا"],
 "(adds emphasis / reassurance)":["(강조·안심시키는 말투)","(للتأكيد / الطمأنة)"],
 "Excuse me / Sorry / Thank you":["저기요 / 죄송해요 / 감사해요","عفوًا / آسف / شكرًا"],
 "Calling staff, apologizing, or thanking someone":["직원을 부를 때, 사과할 때, 감사할 때","لنداء الموظفين، أو الاعتذار، أو الشكر"],
 "One word, three jobs: getting attention (in restaurants), a light apology, and a thank-you when someone goes out of their way for you.":["한 단어로 세 가지 역할: (식당에서) 사람을 부를 때, 가볍게 사과할 때, 일부러 신경 써 준 사람에게 감사할 때.","كلمة واحدة بثلاثة استخدامات: لفت الانتباه (في المطاعم)، واعتذار خفيف، وشكر من تكلّف عناءً من أجلك."],
 "In restaurants, raise your hand and say すみません! clearly — staff usually won't come unless called.":["식당에서는 손을 들고 すみません! 하고 또렷하게 말하세요. 부르지 않으면 직원이 잘 오지 않아요.","في المطاعم ارفع يدك وقل すみません! بوضوح، فالموظفون غالبًا لا يأتون إلا إذا ناديتهم."],
 "Excuse me! Can I order?":["저기요! 주문해도 될까요?","عفوًا! هل يمكنني أن أطلب؟"],
 "Yes, one moment please.":["네, 잠시만 기다려 주세요.","نعم، لحظة من فضلك."],
 "order":["주문","طلب"],
 "is it OK? / may I?":["괜찮을까요? / 해도 될까요?","هل يمكن؟ / هل لي أن…؟"],
 "yes":["네","نعم"],
 "please wait a moment (very polite)":["잠시만 기다려 주십시오 (매우 정중)","انتظر لحظة من فضلك (مهذب جدًا)"],
 "Sorry I'm late.":["늦어서 죄송해요.","آسف على التأخير."],
 "was late (polite past of 遅れる)":["늦었습니다 (遅れる의 정중한 과거형)","تأخرتُ (الماضي المهذب من 遅れる)"],
 "Thank you for going to the trouble.":["일부러 신경 써 주셔서 감사해요.","شكرًا لأنك تكلّفت العناء."],
 "going out of your way":["일부러","تكلّف العناء"],
 "I see / That makes sense":["아하 / 그렇구나","فهمت / هذا منطقي"],
 "When you understand an explanation":["설명을 이해했을 때","عندما تفهم شرحًا"],
 "Shows you understood and agree with the logic. Great for keeping a conversation going.":["이해했고 그 논리에 동의한다는 뜻이에요. 대화를 이어 가기에 좋아요.","تُظهر أنك فهمت ووافقت على المنطق. مفيدة جدًا لاستمرار المحادثة."],
 "Careful: なるほど can sound a little casual to a boss or teacher. そうなんですね is safer.":["주의: 상사나 선생님께 なるほど는 조금 가볍게 들릴 수 있어요. そうなんですね가 더 안전해요.","انتبه: قد تبدو なるほど غير رسمية قليلًا مع المدير أو المعلم. そうなんですね أكثر أمانًا."],
 "Press this button and it opens.":["이 버튼을 누르면 열려요.","اضغط هذا الزر فيُفتح."],
 "I see! That's easy.":["아하! 쉽네요.","فهمت! هذا سهل."],
 "button":["버튼","زر"],
 "to push, press":["누르다","يضغط"],
 "opens (polite form of 開く)":["열립니다 (開く의 정중형)","يُفتح (الصيغة المهذبة من 開く)"],
 "easy, simple":["쉽다, 간단하다","سهل، بسيط"],
 "…isn't it? (polite, sharing a feeling)":["~네요 (정중, 공감)","…أليس كذلك؟ (مهذب، مشاركة شعور)"],
 "I see, so that's what it is.":["아하, 그런 거구나.","فهمت، إذن هذا هو الأمر."],
 "so that's what it is":["그런 거구나","إذن هذا هو الأمر"],
 "Huh, I see. I learned something.":["아하, 그렇구나. 공부가 됐어.","آه، فهمت. تعلّمت شيئًا جديدًا."],
 "I learned something":["공부가 됐다, 배웠다","تعلّمت شيئًا"],
 "Meh / So-so / Hard to say":["애매해 / 그저 그래 / 뭐라 하기 어려워","عادي / لا بأس / يصعب القول"],
 "Giving a not-so-positive opinion softly":["별로라는 의견을 부드럽게 말할 때","عند إبداء رأي غير إيجابي بلطف"],
 "The dictionary meaning is 'subtle', but in conversation it's a soft way to say 'not great'. Popular because it doesn't sound harsh.":["사전 뜻은 '미묘하다'지만, 대화에서는 '별로'를 부드럽게 말하는 표현이에요. 딱딱하게 들리지 않아서 자주 써요.","معناها في القاموس «دقيق، خفيّ»، لكنها في الكلام طريقة لطيفة لقول «ليس جيدًا». شائعة لأنها لا تبدو قاسية."],
 "Ask 微妙？ to get someone's honest opinion. Typical answer: うーん、微妙。":["微妙？ 라고 물으면 솔직한 의견을 들을 수 있어요. 흔한 대답: うーん、微妙。","اسأل 微妙？ لتعرف رأي الشخص الصريح. الإجابة المعتادة: うーん、微妙。"],
 "How was that movie?":["그 영화 어땠어?","كيف كان ذلك الفيلم؟"],
 "Hmm, it was meh.":["음, 애매했어.","همم، كان عاديًا."],
 "that (over there)":["저","ذلك"],
 "movie":["영화","فيلم"],
 "how was it?":["어땠어?","كيف كان؟"],
 "hmm":["음","همم"],
 "Isn't this color kind of meh?":["이 색 좀 애매하지 않아?","أليس هذا اللون غريبًا بعض الشيء؟"],
 "color":["색","لون"],
 "a little, kind of":["조금, 좀","قليلًا، نوعًا ما"],
 "The taste was so-so.":["맛은 그저 그랬어.","كان الطعم عاديًا."],
 "taste, flavor":["맛","طعم، نكهة"],
 "Where?":["어디?","أين؟"],
 "Looking for something or someone":["물건이나 사람을 찾을 때","عند البحث عن شيء أو شخص"],
 "どこ on its own is a casual 'Where?'. Add ですか to make it polite: どこですか？ The pattern [thing]はどこですか？ means 'Where is [thing]?'.":["どこ만 말하면 편한 '어디?'예요. ですか를 붙이면 정중해져요: どこですか？ [물건]はどこですか？는 '[물건]은 어디예요?'라는 뜻이에요.","どこ وحدها تعني «أين؟» بشكل غير رسمي. أضف ですか لتصبح مهذبة: どこですか？ والتركيب [شيء]はどこですか？ يعني «أين [الشيء]؟»."],
 "A lifesaver when you're lost: トイレはどこですか？ (Where's the toilet?) Point at a map while asking and it's even clearer.":["길을 잃었을 때 아주 유용해요: トイレはどこですか？ (화장실은 어디예요?) 지도를 가리키면서 물으면 더 잘 통해요.","منقذة عندما تضيع: トイレはどこですか？ (أين الحمّام؟) أشر إلى خريطة أثناء السؤال ليكون أوضح."],
 "Where is my rabbit?":["내 토끼는 어디에 있어요?","أين أرنبي؟"],
 "where":["어디","أين"],
 "I, me":["나, 저","أنا"],
 "'s, of (shows possession)":["~의 (소유)","لـِ، الخاص بـ (الملكية)"],
 "rabbit":["토끼","أرنب"],
 "(polite question ending)":["(정중한 의문 어미)","(نهاية سؤال مهذبة)"],
 "Where is the toilet?":["화장실은 어디예요?","أين الحمّام؟"],
 "toilet, restroom":["화장실","حمّام، دورة مياه"],
 "Where is the station?":["역은 어디예요?","أين المحطة؟"],
 "(train) station":["(기차) 역","محطة (قطار)"],
 "High, tall / Low, short":["높다 / 낮다","عالٍ، طويل / منخفض، قصير"],
 "Talking about height, prices or levels":["높이, 가격, 수준을 말할 때","عند الحديث عن الارتفاع أو الأسعار أو المستويات"],
 "Both are い-adjectives. 高い means 'high / tall', and for prices it means 'expensive'. Careful: the opposite of 'expensive' is 安い (cheap), not 低い.":["둘 다 い형용사예요. 高い는 '높다'이고, 가격에 쓰면 '비싸다'예요. 주의: '비싸다'의 반대는 低い가 아니라 安い(싸다)예요.","كلتاهما صفة من نوع い. 高い تعني «عالٍ / طويل»، ومع الأسعار تعني «غالٍ». انتبه: عكس «غالٍ» هو 安い (رخيص)، وليس 低い."],
 "For a person's height, say 背が高い (tall) / 背が低い (short).":["사람의 키는 背が高い(키가 크다) / 背が低い(키가 작다)라고 해요.","لطول الشخص قل 背が高い (طويل) / 背が低い (قصير)."],

 {jp:"いただきます", ro:"itadakimasu",

  scene:L("Right before you start eating","開始吃飯的前一刻","开始吃饭之前","खाना खाने से ठीक पहले","ก่อนเริ่มกินข้าว","Ngay trước khi bắt đầu ăn"),
  nuance:L("Literally 'I humbly receive.' It thanks the people who made the food and the lives in it. Japanese people say it even when eating alone.","字面意思是「我謙卑地領受」。感謝做菜的人，也感謝食材的生命。日本人一個人吃飯時也會說。","字面意思是“我谦卑地领受”。感谢做饭的人，也感谢食材的生命。日本人一个人吃饭时也会说。","शाब्दिक अर्थ: 'मैं विनम्रता से ग्रहण करता/करती हूँ।' इसमें खाना बनाने वालों और भोजन के प्रति आभार है। जापानी लोग अकेले खाते समय भी कहते हैं।","แปลตรงตัวว่า 'ขอรับอย่างนอบน้อม' เป็นการขอบคุณคนทำอาหารและชีวิตในวัตถุดิบ คนญี่ปุ่นพูดแม้กินคนเดียว","Nghĩa đen là 'Tôi xin nhận'. Đây là lời cảm ơn người nấu và cả sự sống trong món ăn. Người Nhật nói cả khi ăn một mình."),
  tip:L("Put your hands together and bow slightly. After eating, say ごちそうさまでした.","雙手合十、微微低頭。吃完後說「ごちそうさまでした」。","双手合十，微微低头。吃完后说“ごちそうさまでした”。","दोनों हाथ जोड़कर हल्का सिर झुकाएँ। खाने के बाद ごちそうさまでした कहें।","พนมมือและก้มหัวเล็กน้อย กินเสร็จแล้วพูดว่า ごちそうさまでした","Chắp hai tay và hơi cúi đầu. Ăn xong thì nói ごちそうさまでした."),

 {jp:"よろしくお願(ねが)いします", ro:"yoroshiku onegai shimasu",

  nuance:L("There's no exact English match. It asks for a good relationship from now on. Used at the end of self-introductions, requests and emails.","沒有完全對應的翻譯，意思是「今後請多多關照」。用在自我介紹結尾、拜託別人、郵件結尾。","没有完全对应的翻译，意思是“今后请多多关照”。用在自我介绍结尾、拜托别人、邮件结尾。","इसका कोई सटीक अनुवाद नहीं है। भाव है 'आगे से अच्छे संबंध की उम्मीद'। परिचय के अंत में, अनुरोध करते समय और ईमेल के अंत में बोलते हैं।","ไม่มีคำแปลตรงตัว ความหมายคือ 'ขอให้มีความสัมพันธ์ที่ดีต่อจากนี้' ใช้ท้ายการแนะนำตัว เวลาขอร้อง และท้ายอีเมล","Không có từ tương đương hoàn toàn. Ý là 'mong từ nay được quan tâm giúp đỡ'. Dùng cuối phần tự giới thiệu, khi nhờ vả và cuối email."),
  tip:L("Casual: よろしく! Very polite: よろしくお願いいたします.","輕鬆說法：「よろしく！」 非常禮貌：「よろしくお願いいたします」。","轻松说法：“よろしく！” 非常礼貌：“よろしくお願いいたします”。","अनौपचारिक: よろしく! बहुत विनम्र: よろしくお願いいたします।","แบบกันเอง: よろしく! แบบสุภาพมาก: よろしくお願いいたします","Thân mật: よろしく! Rất lịch sự: よろしくお願いいたします."),

 {jp:"ちょっと…", ro:"chotto…",
  mean:L("Um, that's a bit… (a soft 'no')","這個嘛…有點…（委婉拒絕）","这个嘛…有点…（委婉拒绝）","थोड़ा मुश्किल है… (नरम 'ना')","อืม…ไม่ค่อยสะดวก (ปฏิเสธแบบนุ่มนวล)","Ừm… hơi… (từ chối khéo)"),
  scene:L("Politely turning down an invitation","委婉拒絕邀請時","委婉拒绝邀请时","निमंत्रण विनम्रता से ठुकराते समय","ปฏิเสธคำชวนอย่างสุภาพ","Khi khéo léo từ chối lời mời"),
  nuance:L("ちょっと means 'a little', but trailing off with ちょっと… is a polite 'no'. Japanese often avoids a direct いいえ — leaving the sentence unfinished is the point.","「ちょっと」本來是「一點點」，但話說一半「ちょっと…」就是委婉的拒絕。日語常避免直接說「いいえ（不）」，故意不把話說完正是重點。","“ちょっと”本来是“一点点”，但话说一半“ちょっと…”就是委婉的拒绝。日语常避免直接说“いいえ（不）”，故意不把话说完正是重点。","ちょっと का अर्थ 'थोड़ा' है, पर ちょっと… कहकर वाक्य अधूरा छोड़ना विनम्र 'ना' है। जापानी लोग सीधे いいえ कहने से बचते हैं — वाक्य अधूरा छोड़ना ही असली बात है।","ちょっと แปลว่า 'นิดหน่อย' แต่ถ้าพูดค้างไว้ว่า ちょっと… คือการปฏิเสธอย่างสุภาพ คนญี่ปุ่นมักเลี่ยงการพูด いいえ ตรงๆ การพูดไม่จบประโยคคือหัวใจสำคัญ","ちょっと nghĩa là 'một chút', nhưng nói lửng ちょっと… là cách từ chối lịch sự. Người Nhật thường tránh nói thẳng いいえ — bỏ lửng câu chính là mấu chốt."),
  tip:L("If someone says ちょっと… to you, don't push. It almost always means no.","如果對方說「ちょっと…」，就別再勉強了，幾乎都代表「不行」。","如果对方说“ちょっと…”，就别再勉强了，几乎都代表“不行”。","अगर कोई आपसे ちょっと… कहे, तो ज़ोर न दें। इसका लगभग हमेशा मतलब 'ना' होता है।","ถ้ามีคนพูด ちょっと… กับคุณ อย่าตื๊อ เกือบทุกครั้งหมายถึง 'ไม่'","Nếu ai đó nói ちょっと… với bạn, đừng nài thêm. Hầu như luôn có nghĩa là 'không'."),

 {jp:"大丈夫(だいじょうぶ)です", ro:"daijoubu desu",
  mean:L("I'm fine / No, thank you","沒關係／不用了，謝謝","没关系／不用了，谢谢","मैं ठीक हूँ / जी नहीं, धन्यवाद","ไม่เป็นไร / ไม่ต้อง ขอบคุณ","Không sao / Không cần đâu, cảm ơn"),
  scene:L("Declining an offer in a shop, or saying you're OK","在店裡婉拒，或表示自己沒事時","在店里婉拒，或表示自己没事时","दुकान में कुछ मना करते समय, या 'मैं ठीक हूँ' कहते समय","ปฏิเสธในร้านค้า หรือบอกว่าตัวเองโอเค","Khi từ chối ở cửa hàng, hoặc nói mình ổn"),
  nuance:L("Literally 'safe, OK'. In shops, answering 'Do you need a bag?' with 大丈夫です means 'No thanks'. It confuses even Japanese people — gestures and tone help.","字面是「安全、沒問題」。在店裡被問「需要袋子嗎？」時回答「大丈夫です」就是「不用了」。連日本人都會搞混，要配合手勢和語氣。","字面是“安全、没问题”。在店里被问“需要袋子吗？”时回答“大丈夫です”就是“不用了”。连日本人都会搞混，要配合手势和语气。","शाब्दिक अर्थ 'सुरक्षित, ठीक'। दुकान में 'बैग चाहिए?' के जवाब में 大丈夫です का मतलब 'जी नहीं, धन्यवाद' है। जापानी लोग भी कभी-कभी भ्रमित होते हैं — इशारों और लहजे से समझें।","แปลตรงตัวว่า 'ปลอดภัย, โอเค' ในร้านค้าถ้าถูกถามว่า 'รับถุงไหม?' แล้วตอบ 大丈夫です หมายถึง 'ไม่ต้อง' แม้แต่คนญี่ปุ่นก็สับสน ต้องดูท่าทางและน้ำเสียงประกอบ","Nghĩa đen là 'an toàn, ổn'. Ở cửa hàng, khi được hỏi 'Có cần túi không?' mà trả lời 大丈夫です nghĩa là 'Không cần'. Ngay cả người Nhật cũng dễ nhầm — hãy dựa vào cử chỉ và giọng điệu."),
  tip:L("Add a small wave of the hand to make 'No thanks' clear.","加上輕輕揮手，「不用了」的意思會更清楚。","加上轻轻挥手，“不用了”的意思会更清楚。","'जी नहीं' साफ़ करने के लिए हल्के से हाथ हिलाएँ।","โบกมือเบาๆ ประกอบ จะชัดเจนว่า 'ไม่ต้อง'","Kèm cử chỉ xua tay nhẹ để rõ ý 'Không cần'."),

 {jp:"なるほど", ro:"naruhodo",

 {jp:"微妙(びみょう)", ro:"bimyou",
  mean:L("Meh / So-so / Hard to say","普普通通／不太好說","一般般／不太好说","ठीक-ठाक / कुछ ख़ास नहीं","ก็งั้นๆ / ไม่ค่อยเท่าไหร่","Tàm tạm / Khó nói / Không hay lắm"),
  scene:L("Giving a not-so-positive opinion softly","委婉表達負面意見時","委婉表达负面意见时","नरमी से 'कुछ ख़ास नहीं' वाली राय देते समय","ให้ความเห็นไม่ค่อยดีแบบนุ่มนวล","Khi nhẹ nhàng đưa ra ý kiến không mấy tích cực"),
  nuance:L("The dictionary meaning is 'subtle', but in conversation it's a soft way to say 'not great'. Popular because it doesn't sound harsh.","在中文裡「微妙」是細緻難言的意思，但日語會話中多半是委婉地說「不太好」。因為聽起來不刺耳，所以很常用。","在中文里“微妙”是细致难言的意思，但日语会话中多半是委婉地说“不太好”。因为听起来不刺耳，所以很常用。","शब्दकोश में अर्थ 'सूक्ष्म' है, पर बातचीत में यह 'कुछ ख़ास नहीं' कहने का नरम तरीका है। कठोर नहीं लगता, इसलिए लोकप्रिय है।","ความหมายในพจนานุกรมคือ 'ละเอียดอ่อน' แต่ในบทสนทนาเป็นวิธีพูดอ้อมๆ ว่า 'ไม่ค่อยดี' นิยมใช้เพราะไม่ฟังดูแรง","Nghĩa trong từ điển là 'tinh tế', nhưng khi nói chuyện là cách nói nhẹ nhàng 'không hay lắm'. Được dùng nhiều vì nghe không gay gắt."),
  tip:L("Ask 微妙？ to get someone's honest opinion. Typical answer: うーん、微妙。","可以問「微妙？」來確認對方的真實想法。常見回答：「うーん、微妙。」","可以问“微妙？”来确认对方的真实想法。常见回答：“うーん、微妙。”","किसी की सच्ची राय जानने के लिए 微妙？ पूछें। आम जवाब: うーん、微妙。","ถามว่า 微妙？ เพื่อเช็กความเห็นจริงๆ ของอีกฝ่าย คำตอบที่พบบ่อย: うーん、微妙。","Hỏi 微妙？ để biết ý kiến thật của người khác. Câu trả lời thường gặp: うーん、微妙。"),

 {jp:"どこ", ro:"doko",
  mean:L("Where?","在哪裡？","在哪里？","कहाँ?","ที่ไหน?","Ở đâu?"),
  scene:L("Looking for something or someone","找東西或找人時","找东西或找人时","कोई चीज़ या व्यक्ति ढूँढते समय","ตอนหาของหรือหาคน","Khi tìm đồ vật hoặc tìm người"),
  nuance:L("どこ on its own is a casual 'Where?'. Add ですか to make it polite: どこですか？ The pattern [thing]はどこですか？ means 'Where is [thing]?'.","單說「どこ？」是口語的「在哪？」。加上「ですか」就變成禮貌說法：「どこですか？」。句型「〔東西〕はどこですか？」＝「〔東西〕在哪裡？」。","单说“どこ？”是口语的“在哪？”。加上“ですか”就变成礼貌说法：“どこですか？”。句型“〔东西〕はどこですか？”＝“〔东西〕在哪里？”。","अकेले どこ？ अनौपचारिक 'कहाँ?' है। विनम्र बनाने के लिए ですか जोड़ें: どこですか？ ढाँचा [चीज़]はどこですか？ का अर्थ है '[चीज़] कहाँ है?'","พูดแค่ どこ？ เป็นคำถามแบบกันเองว่า 'ที่ไหน?' ถ้าจะให้สุภาพให้เติม ですか: どこですか？ รูปประโยค [สิ่งของ]はどこですか？ แปลว่า '[สิ่งของ]อยู่ที่ไหน?'","Chỉ nói どこ？ là câu hỏi thân mật 'Ở đâu?'. Muốn lịch sự thì thêm ですか: どこですか？ Mẫu câu [đồ vật]はどこですか？ nghĩa là '[đồ vật] ở đâu?'."),
  tip:L("A lifesaver when you're lost: トイレはどこですか？ (Where's the toilet?) Point at a map while asking and it's even clearer.","迷路時超好用：「トイレはどこですか？」（洗手間在哪裡？）邊問邊指地圖會更清楚。","迷路时超好用：“トイレはどこですか？”（洗手间在哪里？）边问边指地图会更清楚。","रास्ता भटकने पर बहुत काम का: トイレはどこですか？ (शौचालय कहाँ है?) पूछते समय नक्शे की ओर इशारा करें तो और साफ़ होगा।","ใช้ได้ดีมากตอนหลงทาง: トイレはどこですか？ (ห้องน้ำอยู่ที่ไหน?) ถามไปพร้อมชี้แผนที่จะยิ่งชัดเจน","Rất hữu ích khi bị lạc: トイレはどこですか？ (Nhà vệ sinh ở đâu?) Vừa hỏi vừa chỉ vào bản đồ sẽ càng rõ hơn."),
  video:"no11-doko.mp4", solo:true, lines:[

 {jp:"高(たか)い・低(ひく)い", ro:"takai / hikui",
  mean:L("High, tall / Low, short","高／低","高／低","ऊँचा / नीचा","สูง / ต่ำ","Cao / Thấp"),
  scene:L("Talking about height, prices or levels","談論高度、價格或程度時","谈论高度、价格或程度时","ऊँचाई, कीमत या स्तर की बात करते समय","ตอนพูดถึงความสูง ราคา หรือระดับ","Khi nói về độ cao, giá cả hoặc mức độ"),
  nuance:L("Both are い-adjectives. 高い means 'high / tall', and for prices it means 'expensive'. Careful: the opposite of 'expensive' is 安い (cheap), not 低い.","兩個都是い形容詞。「高い」是「高」，用在價錢上則是「貴」。要注意：「貴」的相反是「安い（便宜）」，不是「低い」。","两个都是い形容词。“高い”是“高”，用在价钱上则是“贵”。要注意：“贵”的反义词是“安い（便宜）”，不是“低い”。","दोनों い-विशेषण हैं। 高い का अर्थ 'ऊँचा / लंबा' है, और कीमत के लिए 'महँगा'। ध्यान दें: 'महँगा' का उल्टा 安い (सस्ता) है, 低い नहीं।","ทั้งคู่เป็นคำคุณศัพท์ い 高い แปลว่า 'สูง' และถ้าพูดถึงราคาแปลว่า 'แพง' ระวัง: คำตรงข้ามของ 'แพง' คือ 安い (ถูก) ไม่ใช่ 低い","Cả hai đều là tính từ đuôi い. 高い nghĩa là 'cao', khi nói về giá thì là 'đắt'. Lưu ý: trái nghĩa của 'đắt' là 安い (rẻ), không phải 低い."),
  tip:L("For a person's height, say 背が高い (tall) / 背が低い (short).","說人的身高時用「背が高い（個子高）」「背が低い（個子矮）」。","说人的身高时用“背が高い（个子高）”“背が低い（个子矮）”。","किसी व्यक्ति के कद के लिए कहें: 背が高い (लंबा) / 背が低い (नाटा)।","ถ้าพูดถึงส่วนสูงของคน ใช้ 背が高い (ตัวสูง) / 背が低い (ตัวเตี้ย)","Khi nói về chiều cao của người, dùng 背が高い (cao) / 背が低い (thấp)."),
  video:"no12-takai-hikui.mp4", solo:true, lines:[
   {who:"A", jp:"[[高(たか)い]]。", ro:"Takai.", tr:L("High! / Tall!","好高！","好高！","ऊँचा!","สูง!","Cao!"), t:null},
   {who:"A", jp:"[[低(ひく)い]]。", ro:"Hikui.", tr:L("Low! / Short!","好低！","好低！","नीचा!","ต่ำ!","Thấp!"), t:null}],

  nuance:L("いつ alone is a casual 'When?'. Add ですか to make it polite: いつですか？ The usual pattern is [thing]はいつですか？ = 'When is [thing]?'.","單說「いつ？」是口語的「什麼時候？」。加上「ですか」就變成禮貌說法：「いつですか？」。常用句型「〔事情〕はいつですか？」＝「〔事情〕是什麼時候？」。","单说“いつ？”是口语的“什么时候？”。加上“ですか”就变成礼貌说法：“いつですか？”。常用句型“〔事情〕はいつですか？”＝“〔事情〕是什么时候？”。","अकेले いつ？ अनौपचारिक 'कब?' है। विनम्र बनाने के लिए ですか जोड़ें: いつですか？ आम ढाँचा [चीज़]はいつですか？ का अर्थ है '[चीज़] कब है?'","พูดแค่ いつ？ เป็นคำถามแบบกันเองว่า 'เมื่อไหร่?' ถ้าจะให้สุภาพให้เติม ですか: いつですか？ รูปประโยคที่ใช้บ่อยคือ [สิ่งนั้น]はいつですか？ แปลว่า '[สิ่งนั้น]คือเมื่อไหร่?'","Chỉ nói いつ？ là câu hỏi thân mật 'Khi nào?'. Muốn lịch sự thì thêm ですか: いつですか？ Mẫu câu thường dùng là [việc gì]はいつですか？ nghĩa là '[việc gì] là khi nào?'."),

  nuance:L("ごめん is the casual 'sorry'; adding ね makes it softer and friendlier. 遅れて来て means 'coming late' (遅れる 'be late' + 来る 'come'). With teachers or at work, say 遅れてすみません instead.","「ごめん」是口語的「對不起」，加上「ね」語氣更柔和親切。「遅れて来て」是「來晚了」（遅れる「遲到」＋来る「來」）。對老師或在職場要說「遅れてすみません」。","“ごめん”是口语的“对不起”，加上“ね”语气更柔和亲切。“遅れて来て”是“来晚了”（遅れる“迟到”＋来る“来”）。对老师或在职场要说“遅れてすみません”。","ごめん अनौपचारिक 'सॉरी' है; ね जोड़ने से यह और नरम और दोस्ताना लगता है। 遅れて来て का अर्थ है 'देर से आना' (遅れる 'देर होना' + 来る 'आना')। शिक्षक के सामने या ऑफ़िस में 遅れてすみません कहें।","ごめん คือคำขอโทษแบบกันเอง เติม ね จะฟังนุ่มนวลและเป็นมิตรขึ้น 遅れて来て แปลว่า 'มาสาย' (遅れる 'สาย' + 来る 'มา') ถ้าพูดกับครูหรือที่ทำงาน ให้ใช้ 遅れてすみません","ごめん là 'xin lỗi' thân mật; thêm ね nghe nhẹ nhàng, thân thiện hơn. 遅れて来て nghĩa là 'đến muộn' (遅れる 'muộn' + 来る 'đến'). Với giáo viên hoặc ở chỗ làm, hãy nói 遅れてすみません."),
  tip:L("Politeness ladder: ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (most formal).","禮貌程度由低到高：ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません（最正式）。","礼貌程度由低到高：ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません（最正式）。","विनम्रता का क्रम: ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (सबसे औपचारिक)।","ระดับความสุภาพ: ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (สุภาพที่สุด)","Mức độ lịch sự tăng dần: ごめん → ごめんね → ごめんなさい → すみません → 申し訳ありません (trang trọng nhất)."),

 {jp:"溶(と)けそう", ro:"tokesou",
  mean:L("About to melt / Looks like it'll melt","好像快融化了","好像快化了","पिघलने वाला है","ดูเหมือนจะละลาย","Sắp tan"),

/* Test version: the app shows only these phrases, in this order (by video file name).

   To bring one back, add its video name here (and move its MP4 back from the 待機中の動画 folder). */
const SHOW = ["no14-okurete.mp4", "no11-doko.mp4", "no17-kantan.mp4", "no16-naze.mp4", "no12-takai-hikui.mp4"];
const PHRASES = SHOW.map(v => ALL_PHRASES.find(p => p.video === v)).filter(Boolean);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RB = /([々一-鿿]+)\(([぀-ゟー]+)\)/g;           // 漢字(よみ)
const MARK = /\[\[|\]\]|[{}]/g;
const ruby = s => esc(s).replace(RB, "<ruby>$1<rt>$2</rt></ruby>");
const bare = s => s.replace(RB, "$1").replace(MARK, "");                     // 漢字 only, no readings
const yomi = s => s.replace(RB, "$2").replace(MARK, "").replace(/…/g, "");  // reading for speech
const blanked = s => ruby(s.replace(/\[\[.+?\]\]/, "＿＿＿＿").replace(MARK, ""));

let saved = {};
try { saved = JSON.parse(localStorage.getItem("nihongo-clip-note") || "{}") || {}; } catch (e) { saved = {}; }
function save() { try { localStorage.setItem("nihongo-clip-note", JSON.stringify(saved)); } catch (e) {} }

function guessLang() {
  const ls = (navigator.languages || [navigator.language || "en"]).map(x => String(x).toLowerCase());
  for (const l of ls) {
    if (/^zh-(tw|hk|mo)|hant/.test(l)) return "tw";
    if (l.startsWith("zh")) return "cn";
    if (l.startsWith("hi")) return "hi";
    if (l.startsWith("th")) return "th";
    if (l.startsWith("vi")) return "vi";
    if (l.startsWith("fr")) return "fr";
    if (l.startsWith("pt")) return "pt";
    if (l.startsWith("es")) return "es";
    if (l.startsWith("ko")) return "ko";
    if (l.startsWith("ar")) return "ar";
    if (l.startsWith("en")) return "en";
  }
  return "en";
}
let lang = LANGS.some(l => l[0] === saved.lang) ? saved.lang : guessLang();
const XI = { fr: [XL, 0], pt: [XL, 1], es: [XL, 2], ko: [XL2, 0], ar: [XL2, 1] };
const T = o => {
  if (!o) return "";
  if (o[lang] != null) return o[lang];
  const x = XI[lang], r = x && typeof o.en === "string" ? x[0][o.en] : null;
  return r ? r[x[1]] : o.en;
};
const u = k => T(U[k]);

let cur = Number.isInteger(saved.cur) && saved.cur >= 0 && saved.cur < PHRASES.length ? saved.cur : 0;
const EDIT = new URLSearchParams(location.search).has("edit");
const localVideo = {};      // phrase index -> blob URL picked on this device (not saved)
const avail = {};           // phrase index -> true / false once we know whether its MP4 is there
const revealed = new Set(); // dialogue lines whose translation is shown

const videoOf = i => localVideo[i] || (PHRASES[i].video && avail[i] !== false ? PHRASES[i].video : null);
const segOf = (i, j) => {
  const l = saved.timing && saved.timing[i] && saved.timing[i][j];
  if (l && typeof l.s === "number" && typeof l.e === "number" && l.e > l.s) return [l.s, l.e];
  return PHRASES[i].lines[j].t || null;
};

/* turn a Japanese line into HTML with tappable words */
function lineHTML(words, s) {
  return s.split(/(\[\[.+?\]\]|\{.+?\})/).map(seg => {
    if (seg.startsWith("[[")) return `<button type="button" class="w slang">${ruby(seg.slice(2, -2))}</button>`;
    if (seg.startsWith("{")) { const t = seg.slice(1, -1), k = bare(t); return words[k] ? `<button type="button" class="w" data-k="${esc(k)}">${ruby(t)}</button>` : ruby(t); }
    return ruby(seg);
  }).join("");
}
const sayBtns = s => `<button type="button" class="say" data-speak="${esc(yomi(s))}">${esc(u("listen"))}</button><button type="button" class="say" data-speak="${esc(yomi(s))}" data-rate=".65">${esc(u("listenSlow"))}</button>`;

/* ---------- speech (browser's Japanese voice) ---------- */
function speak(text, rate) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(text);
  m.lang = "ja-JP"; m.rate = rate || 1;
  const v = speechSynthesis.getVoices().find(x => /^ja/i.test(x.lang));
  if (v) m.voice = v;
  speechSynthesis.speak(m);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-speak]");
  if (b) { e.stopPropagation(); speak(b.dataset.speak, +b.dataset.rate || 1); }
}, true);

/* ---------- learn mode ---------- */

}

        <p class="note">${esc(u("localNote"))}</p>
      </div></div>`;
}
const fmt = x => typeof x === "number" ? x.toFixed(1) + " 秒" : "未設定";
function timingJSON() {
  const out = {};
  PHRASES.forEach((p, i) => { out[p.video || "p" + (i + 1)] = p.lines.map((_, j) => segOf(i, j)); });
  return JSON.stringify(out, null, 1).replace(/\[\n\s+([\d.]+),\n\s+([\d.]+)\n\s+\]/g, "[$1, $2]");
}

        ${hasV ? `<p class="tr">${esc(T(l.tr))}</p>` : `<p class="tr hid ${revealed.has(j) ? "" : "hide"}" data-j="${j}">${esc(T(l.tr))}</p>`}
        <div class="mini">
          ${hasV && seg ? `<button type="button" data-play="${j}">${esc(u("line"))}</button><button type="button" data-play="${j}" data-slow="1">${esc(u("slow"))}</button>` : ""}
          <button type="button" data-speak="${esc(yomi(l.jp))}">${esc(u("listen"))}</button>
        </div>
        ${edit ? `<div class="timing" lang="ja">

  const rows = Object.entries(p.words).map(([w, [pos, rd, m]]) =>

  const head = `

  const talk = `
      <div style="display:flex;flex-direction:column;gap:10px" data-pop>
        <span class="tag">${esc(u(hasV ? "tagV" : "tagN"))}</span>
        ${edit ? `<div class="admin" lang="ja"><span class="tag">編集モード（URLの最後に ?edit を付けた時だけ表示）</span>
          <p class="help">動画を再生して、各行の話し始めで「開始」、話し終わりで「終了」の「今の位置」を押します。一時停止してから押すと正確です。設定はこの端末に保存され、下の欄の内容をコピーして送れば、アプリ本体に組み込めます。</p>
          <textarea readonly id="tjson">${esc(timingJSON())}</textarea>
          <div class="row"><button type="button" class="btn" id="tcopy">設定をコピー</button></div></div>` : ""}
        <div class="chat ${p.solo ? "solo" : ""}">${chat}</div>
        <div class="pop" id="pop" aria-live="polite">${esc(u(hasV ? "popV" : "popN"))}</div>
        <div class="row">
          ${hasV ? `<button type="button" class="btn" id="slowall">${esc(u("slowAll"))}</button>` : `<button type="button" class="btn" id="showtr">${esc(u("showAll"))}</button>`}
        </div>

  const exs = (p.examples || []).length ? `

          <p class="jp" lang="ja">${lineHTML(Object.assign({}, p.words, x.words || {}), x.jp)}</p>

  const tail = `

      </div>`;
  /* with a video, the lines, their translation and the word meanings sit right under the video */
  $("cardbody").innerHTML = hasV ? talk + words + exs + head + tail : head + talk + words + exs + tail;
}
function renderCard() { renderStage(); renderBody(); }
function go(i) {
  cur = i; saved.cur = i; save();
  revealed.clear();
  renderChips(); renderCard();
}

let stopAt = null;
function playSeg(t0, t1, slow) {
  const v = $("vid"); if (!v) return;
  v.playbackRate = slow ? 0.6 : 1; v.currentTime = t0; stopAt = t1; v.play().catch(() => {});
}
document.addEventListener("timeupdate", e => {
  const v = e.target; if (v.id === "vid" && stopAt != null && v.currentTime >= stopAt) { v.pause(); stopAt = null; }
}, true);
/* a video file that isn't in the folder yet: fall back to the script view */
document.addEventListener("error", e => {
  const v = e.target;
  /* only "missing / can't play" (code 4) hides the clip; a network hiccup keeps the player so a retry works */
  if (v && v.id === "vid" && !localVideo[cur] && v.error && v.error.code === 4) { avail[cur] = false; renderChips(); renderCard(); }
  else if (v && v.tagName === "VIDEO" && v.closest("#qbody")) v.parentElement.remove();
}, true);
document.addEventListener("loadeddata", e => {
  const v = e.target;
  if (v && v.id === "vid" && !localVideo[cur] && !avail[cur]) { avail[cur] = true; renderChips(); updateTopStats(); }
}, true);

function setTime(j, which) {
  const v = $("vid"); if (!v) return;
  const x = Math.round(v.currentTime * 10) / 10;
  saved.timing = saved.timing || {};
  saved.timing[cur] = saved.timing[cur] || {};
  saved.timing[cur][j] = Object.assign({}, saved.timing[cur][j], { [which]: x });
  save(); renderBody();
}

$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) go(+b.dataset.i); });
$("card").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (e.target.id === "pick") { localVideo[cur] = URL.createObjectURL(f); renderChips(); renderCard(); }
  e.target.value = "";
});
$("card").addEventListener("click", e => {
  const p = PHRASES[cur], t = e.target;
  const w = t.closest(".w");
  if (w) {
    document.querySelectorAll(".w.on").forEach(x => x.classList.remove("on")); w.classList.add("on");
    const box = w.closest("[data-pop]"), pop = (box && box.querySelector(".pop")) || $("pop");
    const all = Object.assign({}, p.words, ...(p.examples || []).map(x => x.words || {}));
    if (w.classList.contains("slang")) {
      pop.innerHTML = `<b lang="ja">${ruby(p.jp)}</b><small>${esc(u("key"))}</small>${esc(T(p.mean))} <button type="button" class="say" data-speak="${esc(yomi(p.jp))}">🔊</button>`;
    } else if (all[w.dataset.k]) {
      const k = w.dataset.k, [pos, rd, m] = all[k];
      pop.innerHTML = `<b lang="ja">${esc(k)}</b>${rd ? `<span lang="ja">（${esc(rd)}）</span> ` : ""}<small>${esc(T(POS[pos]))}</small>${esc(T(m))} <button type="button" class="say" data-speak="${esc(rd || k)}">🔊</button>`;
    }
    return;
  }
  const pb = t.closest("[data-play]");
  if (pb) { const s = segOf(cur, +pb.dataset.play); if (s) playSeg(s[0], s[1], !!pb.dataset.slow); return; }
  const sb = t.closest("[data-set]");
  if (sb) { setTime(+sb.dataset.j, sb.dataset.set); return; }
  const tr = t.closest(".tr.hid");
  if (tr) { const j = +tr.dataset.j; if (revealed.has(j)) revealed.delete(j); else revealed.add(j); tr.classList.toggle("hide"); return; }
  if (t.id === "showtr") { p.lines.forEach((_, j) => revealed.add(j)); document.querySelectorAll("#card .tr.hid").forEach(x => x.classList.remove("hide")); }
  if (t.id === "slowall") playSeg(0, null, true);
  if (t.id === "tcopy") { const a = $("tjson"); a.select(); (navigator.clipboard ? navigator.clipboard.writeText(a.value) : Promise.reject()).catch(() => document.execCommand("copy")); t.textContent = "コピーしました"; }
  if (t.id === "prev" && cur > 0) go(cur - 1);
  if (t.id === "next" && cur < PHRASES.length - 1) go(cur + 1);
});

/* ---------- quiz mode ---------- */
let Q = null;
function newQuiz() {
  const qs = shuffle(PHRASES.map((_, i) => i)).map(i => {
    const type = Math.random() < 0.5 ? "meaning" : "fill";
    const others = shuffle(PHRASES.map((_, k) => k).filter(k => k !== i)).slice(0, 3);
    return { i, type, opts: shuffle([i, ...others]) };
  });
  Q = { qs, n: 0, score: 0, picked: null, missed: [] };
  renderQuiz();
}
function renderQuiz() {
  const box = $("qbody");
  if (!Q) { newQuiz(); return; }
  if (Q.n >= Q.qs.length) return renderResult();
  const q = Q.qs[Q.n], p = PHRASES[q.i], done = Q.picked !== null;
  const keyLine = p.lines.find(l => l.jp.includes("[["));
  const prompt = q.type === "meaning"
    ? `<p class="qtext">${esc(u("qMean"))}</p><p class="qbig" lang="ja">${ruby(p.jp)}</p><p class="ro" style="margin-top:-8px">${esc(p.ro)}</p>`
    : `<p class="qtext">${esc(u("qFill"))}</p>
       <div class="line ${keyLine.who === "B" ? "b" : ""}" style="max-width:100%"><span class="who">${keyLine.who}</span>
       <div class="bub"><p class="jp" lang="ja">${blanked(keyLine.jp)}</p><p class="tr">${esc(T(keyLine.tr))}</p></div></div>`;
  const opts = q.opts.map(k => {
    let cls = "opt" + (q.type === "fill" ? " ja" : "");
    if (done && k === q.i) cls += " right"; else if (done && k === Q.picked) cls += " wrong";
    const label = q.type === "fill" ? `<span lang="ja">${ruby(PHRASES[k].jp)}</span>` : esc(T(PHRASES[k].mean));
    return `<button type="button" class="${cls}" data-k="${k}" ${done ? "disabled" : ""}>${label}</button>`;
  }).join("");
  const v = videoOf(q.i);
  box.innerHTML = `
    <div class="qhead"><span class="tag">QUESTION ${Q.n + 1} / ${Q.qs.length}</span><div class="bar"><span style="width:${Q.n / Q.qs.length * 100}%"></span></div><span class="tag">${esc(u("correct"))} ${Q.score}</span></div>
    ${v ? `<div class="stage" style="border-radius:12px;overflow:hidden"><video src="${esc(v)}" controls playsinline preload="metadata"></video></div>` : ""}
    ${prompt}
    <div class="opts">${opts}</div>
    ${done ? `<div class="fb">${Q.picked === q.i ? `<strong class="ok">${esc(u("ok"))}</strong>` : `<strong class="ng">${esc(u("ng"))}</strong> ${esc(u("ansIs"))} <b lang="ja">${ruby(p.jp)}</b>`}
      <br><span lang="ja">${ruby(p.jp)}</span> ＝ ${esc(T(p.mean))}<br>${esc(T(p.nuance))}</div>
      <div class="row"><button type="button" class="btn main" id="qnext">${esc(u(Q.n + 1 < Q.qs.length ? "nextQ" : "seeRes"))}</button></div>` : ""}`;
}
function renderResult() {
  const best = Math.max(saved.best || 0, Q.score); saved.best = best; save();
  const miss = Q.missed.map(i => `<li><span lang="ja">${ruby(PHRASES[i].jp)}</span><button type="button" class="btn" data-learn="${i}">${esc(u("study"))}</button></li>`).join("");
  $("qbody").innerHTML = `<div class="result">
    <span class="tag">RESULT</span>
    <div class="score">${Q.score}<small> / ${Q.qs.length}</small></div>
    <p style="margin:0">${esc(u(Q.score === Q.qs.length ? "perfect" : "retry"))}　${esc(u("best"))}${best} / ${Q.qs.length}</p>
    ${miss ? `<span class="tag">${esc(u("review"))}</span><ul class="miss">${miss}</ul>` : ""}
    <button type="button" class="btn main" id="qagain">${esc(u("again"))}</button></div>`;
}
$("qbody").addEventListener("click", e => {
  const t = e.target, o = t.closest(".opt");
  if (o && Q.picked === null) {
    const q = Q.qs[Q.n]; Q.picked = +o.dataset.k;
    if (Q.picked === q.i) Q.score++; else Q.missed.push(q.i);
    renderQuiz(); return;
  }
  if (t.id === "qnext") { Q.n++; Q.picked = null; renderQuiz(); }
  if (t.id === "qagain") newQuiz();
  if (t.dataset.learn) { setMode("learn"); go(+t.dataset.learn); }
});

/* ---------- mode switch & display toggles ---------- */
function setMode(m) {
  $("learn").hidden = m !== "learn"; $("quiz").hidden = m !== "quiz";
  $("m-learn").setAttribute("aria-pressed", m === "learn"); $("m-quiz").setAttribute("aria-pressed", m === "quiz");
  saved.mode = m; save();
  if (m === "quiz") renderQuiz();
}
$("m-learn").addEventListener("click", () => setMode("learn"));
$("m-quiz").addEventListener("click", () => setMode("quiz"));
function applyToggles() {
  const furi = saved.furi !== false, ro = saved.ro !== false;
  document.body.classList.toggle("nofuri", !furi); document.body.classList.toggle("noro", !ro);
  $("tg-furi").setAttribute("aria-pressed", furi); $("tg-ro").setAttribute("aria-pressed", ro);
}
$("tg-furi").addEventListener("click", () => { saved.furi = saved.furi === false; save(); applyToggles(); });
$("tg-ro").addEventListener("click", () => { saved.ro = saved.ro === false; save(); applyToggles(); });

/* ---------- language ---------- */
$("langsel").innerHTML = LANGS.map(([id, name]) => `<option value="${id}">${name}</option>`).join("");
$("t-langs").innerHTML = LANGS.map(([id, name, h]) => `<button type="button" class="lg" data-l="${id}" lang="${h}">${name}</button>`).join("");
function setLang(l) {
  lang = l; saved.lang = l; save();
  document.documentElement.lang = LANGS.find(x => x[0] === l)[2];
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-u]").forEach(el => { el.textContent = u(el.dataset.u); });
  $("langsel").value = l;
  document.querySelectorAll(".lg").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === l));
  renderTicker(); renderChips(); renderCard();
  if (!$("quiz").hidden && Q) renderQuiz();
}
$("langsel").addEventListener("change", e => setLang(e.target.value));
$("t-langs").addEventListener("click", e => { const b = e.target.closest(".lg"); if (b) setLang(b.dataset.l); });

/* ---------- top page ---------- */
function renderTicker() {
  const html = PHRASES.map((p, i) => `<button type="button" class="tk ${avail[i] ? "v" : ""}" data-i="${i}"><i>${i + 1}</i><b lang="ja">${esc(bare(p.jp))}</b><small>${esc(T(p.mean))}</small></button>`).join("");
  $("t-track").innerHTML = html + html.replace(/<button /g, '<button tabindex="-1" aria-hidden="true" ');
}
function updateTopStats() {
  $("t-np").textContent = PHRASES.length;
  $("t-nv").textContent = PHRASES.filter((_, i) => avail[i]).length;
}
/* the top page always plays the どこ clip (owner's choice), even after more videos are added */
const BG_VIDEO = "no11-doko.mp4";
function nextBg() {
  const v = $("bgv");
  if (v.src || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  v.loop = true; v.src = BG_VIDEO; v.play().catch(() => {});
}
function showTop(on) {
  $("top").hidden = !on; $("app").hidden = on;
  const v = $("bgv");
  if (on) { if (!v.src) nextBg(); else v.play().catch(() => {}); } else v.pause();
  scrollTo(0, 0);
}
$("t-start").addEventListener("click", () => { setMode("learn"); showTop(false); });
$("t-quiz").addEventListener("click", () => { setMode("quiz"); newQuiz(); showTop(false); });
$("t-track").addEventListener("click", e => { const b = e.target.closest(".tk"); if (b) { setMode("learn"); go(+b.dataset.i); showTop(false); } });
$("tohome").addEventListener("click", () => showTop(true));

/* find out which MP4s are in the folder (on a web server; opened as a plain file, the player's own error decides).
   One request at a time, and only a real "not found" counts as missing: a busy or refused answer leaves it to the player. */
async function probeVideos() {
  for (let i = 0; i < PHRASES.length; i++) {
    const p = PHRASES[i];
    if (!p.video) { avail[i] = false; continue; }
    try {
      const r = await fetch(p.video, { method: "HEAD", cache: "no-store" });
      if (r.ok) avail[i] = true; else if (r.status === 404 || r.status === 410) avail[i] = false;
    } catch (e) { /* unknown */ }
  }
  updateTopStats(); renderTicker(); renderChips(); renderCard();
  if (!$("top").hidden && !$("bgv").src) nextBg();
}

/* ---------- start ---------- */
applyToggles();
setLang(lang);
setMode(saved.mode === "quiz" ? "quiz" : "learn");
updateTopStats();
showTop(!EDIT);
probeVideos();

/* ---------- FREE download = install the PWA ---------- */
let installEvt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
addEventListener("appinstalled", () => { installEvt = null; $("t-dl").hidden = true; });
if (isStandalone()) $("t-dl").hidden = true;
function installSteps() {
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const k = ios ? "ios" : /Android/.test(ua) ? "android" : "desktop";
  return `<ol>${u(k).map(s => `<li>${s}</li>`).join("")}</ol>`;
}
$("t-dl").addEventListener("click", async () => {
  if (installEvt) {
    installEvt.prompt();
    try { const r = await installEvt.userChoice; if (r.outcome === "accepted") $("t-dl").hidden = true; } catch (e) {}
    installEvt = null; return;
  }
  $("t-steps").innerHTML = installSteps(); $("t-sheet").hidden = false; $("t-sheet-x").focus();
});
$("t-sheet-x").addEventListener("click", () => { $("t-sheet").hidden = true; });
$("t-sheet").addEventListener("click", e => { if (e.target.id === "t-sheet") $("t-sheet").hidden = true; });
addEventListener("keydown", e => { if (e.key === "Escape") $("t-sheet").hidden = true; });
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
