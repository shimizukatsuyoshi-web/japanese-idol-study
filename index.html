<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Zen+Maru+Gothic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Myanmar:wght@400;700&display=swap">
<style>
/* Same layout as Slang Clip Note (JAPANESE IDOL STUDY): top page, then one phrase at a time — video stage, the lines, word list; a Learn/Quiz switch above.
   The page itself is in the learner's language (html lang); every piece of Japanese is marked lang="ja". */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --ink:#1b1f2e; --muted:#636878; --line:#e3e0d8;
  --accent:#d2452b; --on-accent:#ffffff; --ai:#24407c; --stage:#17223f; --stage-ink:#eef1ff;
  --hl:#ffe27a; --hl-ink:#1b1f2e; --bub-a:#fff1dc; --bub-b:#ffe3d6; --ok:#1b8455; --ng:#cc3434;
  /* explanation boxes: cream × orange (option 3) — bubbles A cream / B peach, meaning box + examples pale cream, tip cream → orange */
  --grad-bub:var(--bub-a); --grad-bub-b:var(--bub-b); --grad-soft:#fff8ee; --grad-tip:linear-gradient(135deg,#fff1dc,#ffe3d6);
  --en:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ja:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141c; --surface:#1a1f2b; --ink:#eceef4; --muted:#9ea4b6; --line:#2d3342;
  --accent:#ff7a5c; --on-accent:#230a04; --ai:#9fb6ff; --stage:#0b0f1a; --stage-ink:#e3e8ff;
  --hl:#6a5414; --hl-ink:#fff4c9; --bub-a:#33291d; --bub-b:#3b2620; --ok:#4cc38a; --ng:#ff7d7d;
  --grad-bub:var(--bub-a); --grad-bub-b:var(--bub-b); --grad-soft:#201b16; --grad-tip:linear-gradient(135deg,#3d2f1d,#3f2820); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#1a1f2b; --ink:#eceef4; --muted:#9ea4b6; --line:#2d3342;
  --accent:#ff7a5c; --on-accent:#230a04; --ai:#9fb6ff; --stage:#0b0f1a; --stage-ink:#e3e8ff;
  --hl:#6a5414; --hl-ink:#fff4c9; --bub-a:#33291d; --bub-b:#3b2620; --ok:#4cc38a; --ng:#ff7d7d;
  --grad-bub:var(--bub-a); --grad-bub-b:var(--bub-b); --grad-soft:#201b16; --grad-tip:linear-gradient(135deg,#3d2f1d,#3f2820); color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.75}
:lang(ja){font-family:var(--ja)}
:lang(hi){font-family:"Noto Sans Devanagari",var(--ui)}
:lang(th){font-family:"Noto Sans Thai",var(--ui)}
:lang(zh-Hant){font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",var(--ui)}
:lang(zh-Hans){font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",var(--ui)}
:lang(vi){font-family:var(--ui)}
:lang(ko){font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",var(--ui)}
:lang(ar){font-family:"Noto Sans Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif}
/* Burmese script is tall: its own font and a little more line height */
:lang(my){font-family:"Noto Sans Myanmar","Myanmar Text","Myanmar Sangam MN",var(--ui);line-height:1.9}
/* Arabic turns the page right-to-left; Japanese, romaji and the brand stay left-to-right */
[dir="rtl"] [lang="ja"],[dir="rtl"] .ro,[dir="rtl"] .htitle,[dir="rtl"] .tlogo,[dir="rtl"] .brand h1,[dir="rtl"] .kicker,[dir="rtl"] .qhead .tag{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .opt,[dir="rtl"] .sheet .box{text-align:right}
[dir="rtl"] .sheet ol{padding-left:0;padding-right:1.3em}
[dir="rtl"] .top::after{right:auto;left:-.08em}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:18px}
button,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}

ruby rt{font-size:.5em;color:var(--muted);font-weight:400;letter-spacing:0}
body.nofuri rt{display:none}
body.noro .ro{display:none}

header{display:flex;flex-direction:column;gap:12px}
/* learn screen title: JAPANESE IDOL STUDY in the top page's style — IDOL in the same pink → purple */
.brand h1{font-family:var(--en);font-weight:800;font-size:1.9rem;line-height:1.05;margin:0;letter-spacing:-.03em;cursor:pointer}
.brand h1 span{color:transparent;background:linear-gradient(95deg,#ff4f9a,#a06bff);-webkit-background-clip:text;background-clip:text}
.beta{font-family:var(--en);font-style:normal;font-size:.75rem;font-weight:700;vertical-align:middle;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 10px;margin-left:6px;letter-spacing:.06em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .seg{margin-left:auto}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer}
.langpick{display:inline-flex;align-items:center;gap:6px}
.langpick span{font-family:var(--en);font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer}
.tog[aria-pressed="true"]{border-color:var(--ai);color:var(--ai);font-weight:700}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 18px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--surface)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:700}
.chip i{font-style:normal;font-family:var(--en);font-size:.72rem;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bub-a);color:var(--ai);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chip[aria-pressed="true"] i{background:var(--accent);color:var(--on-accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stage{position:relative;background:var(--stage);color:var(--stage-ink);aspect-ratio:16/9;max-width:100%;display:grid}
.stage video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.empty{padding:18px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.empty .lab{font-size:.72rem;letter-spacing:.12em;opacity:.75;font-weight:700}
.empty h3{margin:0;font-size:1.02rem}
.script{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:1.05rem}
.script b{display:inline-block;width:1.6em;color:var(--hl);font-family:var(--en)}
.pick{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid currentColor;border-radius:999px;padding:4px 14px;font-size:.85rem;cursor:pointer;position:relative}
.pick input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:.78rem;opacity:.8;margin:0}

.body{padding:20px;display:flex;flex-direction:column;gap:18px}
.tag{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
.phrase{display:flex;flex-direction:column;gap:2px}
.phrase .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phrase h2{font-weight:700;font-size:clamp(2rem,7vw,2.7rem);line-height:1.35;margin:0;text-wrap:balance}
.phrase .ro{font-family:var(--en);color:var(--muted);font-size:1rem}
.phrase .mean{font-size:1.15rem;font-weight:700;color:var(--ai)}
.phrase .scene{display:inline-block;margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:700}
.nuance{margin:0;color:var(--muted);max-width:62ch}

.say{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 9px;font-size:.8rem;cursor:pointer;line-height:1.8}
.chat{display:flex;flex-direction:column;gap:12px}
.line{display:flex;gap:10px;align-items:flex-start;max-width:94%}
.line.b{flex-direction:row-reverse;align-self:flex-end}
.who{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:.85rem;background:var(--ai);color:var(--surface)}
.line.b .who{background:var(--accent);color:var(--on-accent)}
.bub{background:var(--grad-bub);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.line.b .bub{background:var(--grad-bub-b)}
.jp{font-size:1.3rem;font-weight:700;line-height:2;margin:0}
.ro{margin:0;font-family:var(--en);font-size:.85rem;color:var(--muted)}
.w{background:none;border:0;padding:0 1px;cursor:pointer;border-radius:4px;border-bottom:2px dotted var(--ai);font-weight:inherit;line-height:inherit}
.w.slang{background:var(--hl);color:var(--hl-ink);border-bottom:0;padding:0 4px}
.w.on{outline:2px solid var(--accent)}
.tr{margin:0;font-size:.95rem;color:var(--ink)}
.tr.hid{cursor:pointer;color:var(--muted)}
.tr.hid.hide{filter:blur(5px);user-select:none}
.chat.solo .line{max-width:100%}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 10px;font-size:.78rem;cursor:pointer}
.examples{display:flex;flex-direction:column;gap:10px}
.ex{background:var(--grad-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.ex .jp{font-size:1.12rem}
.exw{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.exw b{color:var(--ink);margin-right:4px}
.pop{min-height:3.2em;border-radius:12px;background:var(--grad-soft);padding:10px 14px;font-size:.95rem;color:var(--muted)}
.pop b{color:var(--ink);font-size:1.1rem;margin-right:6px}
.pop small{border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 12px;font-size:.85rem;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;padding:8px 18px}
.btn:disabled{opacity:.45;cursor:default}

.words{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
td.wd{white-space:nowrap}
td.wd b{font-size:1.02rem}
td.wd small{display:block;color:var(--muted);font-size:.75rem}
td.pos{color:var(--muted);font-size:.78rem;white-space:nowrap}
.tip{background:var(--grad-tip);border-radius:14px;padding:12px 16px}
.tip p{margin:2px 0 0}
.nav{display:flex;justify-content:space-between;gap:8px}

/* edit mode (?edit): line timings for the owner */
.admin{padding:14px 16px;border:1px dashed var(--ai);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.help{margin:0;font-size:.85rem}
.admin textarea{width:100%;box-sizing:border-box;min-height:7em;font:12px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink)}
.timing{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.timing b{color:var(--ink);font-variant-numeric:tabular-nums}
.timing button{border:1px solid var(--ai);color:var(--ai);background:var(--surface);border-radius:999px;padding:0 10px;cursor:pointer}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtext{font-size:1.1rem;font-weight:700;margin:0}
.qbig{font-weight:700;font-size:2.3rem;line-height:1.5;margin:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;min-width:0}
.opt.ja{font-weight:700;font-size:1.1rem}
.opt:hover:not(:disabled){border-color:var(--ai)}
.opt.right{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.opt.wrong{border-color:var(--ng);box-shadow:0 0 0 1px var(--ng) inset}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 16px;background:var(--bg)}
.fb strong.ok{color:var(--ok)} .fb strong.ng{color:var(--ng)}
.result{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.score{font-family:var(--en);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:1.2rem;color:var(--muted)}
.miss{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;width:100%}
.miss li{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.miss span{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- top page ---------- */
.top{position:relative;min-height:100svh;background:#0f1630;color:#f2f4ff;overflow:hidden;display:flex;flex-direction:column}
.top .bgv{position:absolute;top:0;left:0;width:100%;height:100svh;object-fit:cover;object-position:50% 30%;opacity:.5}
/* wider screens: the clip sits on the right 62% so the face is clear of the text column on the left; its left edge fades into the page */
@media (min-width:641px){
  .top .bgv{left:auto;right:0;width:62%;object-position:50% 40%;opacity:.8;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 28%);mask-image:linear-gradient(90deg,transparent 0,#000 28%)}
  .top .hlead{max-width:24em}
}
.top::before{content:"";position:absolute;inset:0;background:
  radial-gradient(120% 80% at 85% 10%,rgba(210,69,43,.5),transparent 55%),
  radial-gradient(90% 70% at 0% 100%,rgba(52,90,190,.6),transparent 60%),
  linear-gradient(180deg,rgba(15,22,48,.3) 0%,rgba(15,22,48,.55) 45%,#0f1630 100%);z-index:1}
.top::after{content:"日本語";position:absolute;right:-.08em;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:var(--ja);font-weight:700;font-size:min(34vw,16rem);line-height:1;color:rgba(255,255,255,.05);z-index:1;pointer-events:none}
.top > *{position:relative;z-index:2}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 20px;max-width:1080px;width:100%;margin:0 auto;box-sizing:border-box}
.tlogo{font-family:var(--en);font-weight:800;font-size:clamp(.82rem,3.6vw,1.05rem);letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tpill{white-space:nowrap}
.tlogo i{width:26px;height:26px;border-radius:8px;background:#d2452b;display:grid;place-items:center;font-style:normal;font-family:var(--ja);font-size:.85rem}
.tpill{font-family:var(--en);font-size:.72rem;font-weight:700;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px;letter-spacing:.08em}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:16px 20px 36px;max-width:1080px;width:100%;margin:0 auto;box-sizing:border-box}
/* small line above the title: one solid orange */
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.2em;font-family:var(--en);color:#ff8f5a;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.kicker span{font-family:var(--ja);letter-spacing:.1em}
/* the kicker line now lists the app's languages: "🌐 SELECT YOUR LANGUAGE" in white, then each language in its own colour */
.kicker.kl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:800;letter-spacing:.14em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.kl span,.kl b{font-family:var(--en);letter-spacing:.14em}
.kl i{font-style:normal;color:rgba(255,255,255,.55)}
.kl .sl{color:#fff;margin-right:6px}
.kl .gl{letter-spacing:0;margin-right:2px}
/* title sits about one line lower and ~40% smaller than the original, so more of the background clip shows above it */
.htitle{font-family:var(--en);font-weight:800;font-size:clamp(1.75rem,7.8vw,4.4rem);line-height:.9;letter-spacing:-.045em;margin:.9em 0 0}
.htitle span{display:block}
.htitle .c{width:fit-content;color:transparent;background:linear-gradient(95deg,#ff4f9a,#a06bff);-webkit-background-clip:text;background-clip:text}
.hlead{font-size:clamp(1.05rem,3.6vw,1.35rem);font-weight:700;margin:0;max-width:32em;line-height:1.6}
.hlead small{display:block;font-weight:400;font-size:.88em;color:#cdd3ee;margin-top:4px}
.langs{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.langs > span{font-family:var(--en);font-size:.78rem;color:#cdd3ee;font-weight:700;letter-spacing:.12em}
.tsel{font:inherit;font-size:1rem;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 40px 9px 18px;cursor:pointer;min-width:220px;max-width:100%;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.tsel option{color:#0f1630;background:#fff}
.tsel:focus-visible{outline:2px solid #ffd36e;outline-offset:2px}
[dir="rtl"] .tsel{padding:9px 18px 9px 40px;background-position:20px 55%,26px 55%}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.cta button{font:inherit;font-weight:700;border-radius:999px;padding:14px 28px;font-size:1.02rem;cursor:pointer;border:0;transition:transform .15s}
.cta button:hover{transform:translateY(-2px)}
.cta .go{background:#d2452b;color:#fff;box-shadow:0 10px 30px -8px rgba(210,69,43,.8)}
.cta .ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:6px;align-items:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--en);font-size:1.9rem;font-weight:800;line-height:1}
.stats span{font-size:.75rem;color:#cdd3ee;margin-top:4px}

 "At work, in clubs, or after finishing something together":["회사나 동아리에서, 또는 함께 일을 끝낸 후에","في العمل أو النوادي، أو بعد إنهاء عمل معًا"],
 "A greeting at work. Say it to coworkers when you meet them or go home.":["직장에서 하는 인사예요. 동료를 만날 때나 퇴근할 때 말해요.","تحية في العمل. قلها للزملاء عند لقائهم أو عند المغادرة."],
 "With friends, just say お疲れ! When leaving before others: お先に失礼します.":["친구끼리는 お疲れ! 라고만 해요. 남보다 먼저 퇴근할 때는 お先に失礼します.","مع الأصدقاء قل فقط お疲れ! وعند المغادرة قبل الآخرين: お先に失礼します."],
 "The meeting is over.":["회의 끝났습니다.","انتهى الاجتماع."],
 "Thanks for your hard work!":["수고하셨습니다!","شكرًا على مجهودك!"],
 "meeting":["회의","اجتماع"],
 "has finished (basic form: 終わる = to end)":["끝났습니다 (기본형: 終わる = 끝나다)","انتهى (الأصل: 終わる = ينتهي)"],
 "Thanks for today. I'll be heading out first.":["오늘 수고하셨습니다. 먼저 들어가 보겠습니다.","شكرًا على اليوم. سأغادر أولًا."],
 "excuse me for leaving first":["먼저 실례하겠습니다","اعذروني على المغادرة أولًا"],
 "Good job today, too!":["오늘도 수고했어!","أحسنت اليوم أيضًا!"],

 "Nice to meet you / I'm counting on you":["잘 부탁드립니다 / 부탁해요","تشرفنا / أعتمد عليك"],

 "Say it when you meet someone new or ask for help. It means 'Please be kind to me.'":["처음 만날 때나 부탁할 때 말해요. '잘 부탁드립니다'라는 뜻이에요.","قلها عند لقاء شخص جديد أو طلب المساعدة. تعني «أرجو أن نتعاون جيدًا»."],
 "Casual: よろしく! Very polite: よろしくお願いいたします.":["편하게: よろしく! 아주 정중하게: よろしくお願いいたします.","غير رسمي: よろしく! مهذب جدًا: よろしくお願いいたします."],

 "I look forward to getting to know you.":["잘 부탁드립니다.","يسعدني التعرّف إليكم."],

 "ちょっと means 'a little'. If you stop after ちょっと…, it is a soft 'no'.":["ちょっと는 '조금'이라는 뜻이에요. ちょっと… 하고 말을 멈추면 부드러운 거절이에요.","ちょっと تعني «قليلًا». قول ちょっと… ثم التوقف هو «لا» بلطف."],
 "If someone says ちょっと… to you, don't push. It almost always means no.":["상대가 ちょっと…라고 하면 더 조르지 마세요. 거의 항상 거절이라는 뜻이에요.","إذا قال لك أحد ちょっと… فلا تُلحّ. فهي تعني «لا» في أغلب الأحيان."],
 "Want to go for drinks tonight?":["오늘 밤 한잔하러 갈래?","هل نخرج لنشرب شيئًا الليلة؟"],

 "Wait a sec!":["잠깐만!","انتظر لحظة!"],

 "I'm fine / No, thank you":["괜찮아요 / 아니요, 됐어요","أنا بخير / لا، شكرًا"],

 "Means 'I'm OK.' In shops, it also means 'No, thank you.'":["'괜찮아요'라는 뜻이에요. 가게에서는 '아니요, 됐어요'라는 뜻도 돼요.","تعني «أنا بخير». وفي المتاجر تعني أيضًا «لا، شكرًا»."],
 "Add a small wave of the hand to make 'No thanks' clear.":["손을 살짝 저으면 '괜찮아요'라는 뜻이 분명해져요.","حرّك يدك قليلًا ليتضح أنك تقصد «لا، شكرًا»."],

 "Excuse me / Sorry / Thank you":["저기요 / 죄송해요 / 감사해요","عفوًا / آسف / شكرًا"],
 "Calling staff, apologizing, or thanking someone":["직원을 부를 때, 사과할 때, 감사할 때","لنداء الموظفين، أو الاعتذار، أو الشكر"],
 "Means 'Excuse me,' 'Sorry' or 'Thank you.'":["'저기요', '죄송해요', '고마워요'라는 뜻이에요.","تعني «عفوًا» أو «آسف» أو «شكرًا»."],
 "In restaurants, raise your hand and say すみません! clearly — staff usually won't come unless called.":["식당에서는 손을 들고 すみません! 하고 또렷하게 말하세요. 부르지 않으면 직원이 잘 오지 않아요.","في المطاعم ارفع يدك وقل すみません! بوضوح، فالموظفون غالبًا لا يأتون إلا إذا ناديتهم."],

 "Thank you for going to the trouble.":["일부러 신경 써 주셔서 감사해요.","شكرًا لأنك تكلّفت العناء."],

 "I see / That makes sense":["아하 / 그렇구나","فهمت / هذا منطقي"],
 "When you understand an explanation":["설명을 이해했을 때","عندما تفهم شرحًا"],
 "Means 'I see.' Say it when you understand something.":["'그렇구나'라는 뜻이에요. 무언가를 이해했을 때 말해요.","تعني «فهمت». قلها عندما تفهم شيئًا."],
 "Careful: なるほど can sound a little casual to a boss or teacher. そうなんですね is safer.":["주의: 상사나 선생님께 なるほど는 조금 가볍게 들릴 수 있어요. そうなんですね가 더 안전해요.","انتبه: قد تبدو なるほど غير رسمية قليلًا مع المدير أو المعلم. そうなんですね أكثر أمانًا."],

 "I see! That's easy.":["아하! 쉽네요.","فهمت! هذا سهل."],

 "…isn't it? (polite, sharing a feeling)":["~네요 (정중, 공감)","…أليس كذلك؟ (مهذب، مشاركة شعور)"],
 "I see, so that's what it is.":["아하, 그런 거구나.","فهمت، إذن هذا هو الأمر."],

 "taste, flavor":["맛","طعم، نكهة"],

 "どこ means 'where'. トイレはどこですか？ = Where is the toilet?":["どこ는 '어디'라는 뜻이에요. トイレはどこですか？ = 화장실은 어디예요?","どこ تعني «أين». トイレはどこですか？ = أين الحمّام؟"],
 "If you get lost, ask: 駅はどこですか？ (Where is the station?) Showing a map on your phone helps too.":["길을 잃으면 이렇게 물어보세요: 駅はどこですか？ (역은 어디예요?) 휴대폰 지도를 같이 보여 주면 더 좋아요.","إذا ضللت الطريق فاسأل: 駅はどこですか？ (أين المحطة؟) ويساعد أيضًا أن تُري الشخص خريطة على هاتفك."],

 "高い = high, tall, expensive. 低い = low, short.":["高い = 높다, 키가 크다, 비싸다. 低い = 낮다, 키가 작다.","高い = عالٍ، طويل، غالٍ. 低い = منخفض، قصير."],
 "For people, say 背が高い (tall) and 背が低い (short). 背 means 'body height'.":["사람의 키는 背が高い(키가 크다), 背が低い(키가 작다)라고 해요. 背는 '키'라는 뜻이에요.","للأشخاص قل 背が高い (طويل) و背が低い (قصير). 背 تعني «طول القامة»."],

 "When?":["언제?","متى؟"],

 "いつ means 'when'. 誕生日はいつですか？ = When is your birthday?":["いつ는 '언제'라는 뜻이에요. 誕生日はいつですか？ = 생일이 언제예요?","いつ تعني «متى». 誕生日はいつですか？ = متى عيد ميلادك؟"],
 "To answer, say the date and add です: 5月3日です (It's May 3rd).":["대답할 때는 날짜 뒤에 です를 붙여요: 5月3日です (5월 3일이에요).","للإجابة، قل التاريخ وأضف です: 5月3日です (إنه 3 مايو)."],

 "Use ごめんね only with friends and family. To a teacher or at work, say すみません: 遅れてすみません (I'm sorry I'm late).":["ごめんね는 친구나 가족에게만 써요. 선생님이나 회사에서는 すみません이라고 해요: 遅れてすみません (늦어서 죄송합니다).","استخدم ごめんね مع الأصدقاء والعائلة فقط. مع المعلّم أو في العمل قل すみません: 遅れてすみません (آسف على التأخير)."],
 "Sorry I'm late!":["늦게 와서 미안해!","آسف على التأخير!"],

 "Put your hands together and bow slightly. After eating, say ごちそうさまでした.":["Satukan kedua tangan dan sedikit membungkuk. Setelah makan, ucapkan ごちそうさまでした.","လက်နှစ်ဖက်ကို ယှဉ်ပြီး ခေါင်းနည်းနည်း ညွှတ်ပါ။ စားပြီးရင် ごちそうさまでした လို့ ပြောပါ။"],
 "Here, go ahead and eat.":["Silakan, ayo makan.","ကဲ၊ စားပါ။"],
 "Wow, looks delicious! Thank you for the food!":["Wah, kelihatannya enak! Terima kasih atas makanannya!","ဝိုး၊ စားလို့ကောင်းမယ့်ပုံပဲ! အစားအစာအတွက် ကျေးဇူးတင်ပါတယ်!"],

 "Hands together — itadakimasu.":["Tangan disatukan: itadakimasu.","လက်ယှဉ်ပြီး — အိတာဒါခိမတ်စု။"],

 "put together (basic form: 合わせる = to put together)":["menyatukan (bentuk dasar: 合わせる = menyatukan)","ပူးကပ်ပြီး (မူလပုံစံ: 合わせる = ပူးကပ်သည်)"],

 "At work, in clubs, or after finishing something together":["Di kantor, di klub, atau setelah menyelesaikan sesuatu bersama","အလုပ်မှာ၊ အသင်းမှာ သို့မဟုတ် တစ်ခုခုကို အတူပြီးဆုံးပြီးနောက်"],
 "A greeting at work. Say it to coworkers when you meet them or go home.":["Salam di tempat kerja. Ucapkan ke rekan kerja saat bertemu atau pulang.","အလုပ်မှာ နှုတ်ဆက်တဲ့စကားပါ။ လုပ်ဖော်ကိုင်ဖက်နဲ့ တွေ့တဲ့အခါ ဒါမှမဟုတ် အိမ်ပြန်တဲ့အခါ ပြောပါ။"],
 "With friends, just say お疲れ! When leaving before others: お先に失礼します.":["Dengan teman cukup bilang お疲れ! Saat pulang lebih dulu: お先に失礼します.","သူငယ်ချင်းတွေနဲ့ဆိုရင် お疲れ! လို့ပဲ ပြောပါ။ တခြားသူတွေထက် စောပြန်ရင်: お先に失礼します."],
 "The meeting is over.":["Rapatnya sudah selesai.","အစည်းအဝေး ပြီးသွားပါပြီ။"],
 "Thanks for your hard work!":["Terima kasih atas kerja kerasnya!","ပင်ပန်းသွားပြီနော်!"],

 "Nice to meet you / I'm counting on you":["Senang berkenalan / Mohon bantuannya","တွေ့ရတာ ဝမ်းသာပါတယ် / အားကိုးပါတယ်"],
 "Introducing yourself, or asking someone for a favor":["Saat memperkenalkan diri atau meminta tolong","ကိုယ့်ကိုယ်ကို မိတ်ဆက်တဲ့အခါ သို့မဟုတ် အကူအညီတောင်းတဲ့အခါ"],
 "Say it when you meet someone new or ask for help. It means 'Please be kind to me.'":["Ucapkan saat bertemu orang baru atau minta tolong. Artinya 'Mohon bantuannya.'","လူသစ်နဲ့ တွေ့တဲ့အခါ ဒါမှမဟုတ် အကူအညီတောင်းတဲ့အခါ ပြောပါ။ 'ကူညီပေးပါ' လို့ အဓိပ္ပာယ်ရပါတယ်။"],
 "Casual: よろしく! Very polite: よろしくお願いいたします.":["Santai: よろしく! Sangat sopan: よろしくお願いいたします.","ရင်းနှီးပုံစံ: よろしく! အလွန်ယဉ်ကျေးပုံစံ: よろしくお願いいたします."],

 "Politely turning down an invitation":["Menolak ajakan dengan sopan","ဖိတ်ခေါ်မှုကို ယဉ်ယဉ်ကျေးကျေး ငြင်းတဲ့အခါ"],
 "ちょっと means 'a little'. If you stop after ちょっと…, it is a soft 'no'.":["ちょっと artinya 'sedikit'. Bilang ちょっと… lalu berhenti adalah cara halus untuk menolak.","ちょっと ဆိုတာ 'နည်းနည်း' ပါ။ ちょっと… လို့ပြောပြီး ရပ်လိုက်ရင် ယဉ်ယဉ်ကျေးကျေး ငြင်းတာပါ။"],
 "If someone says ちょっと… to you, don't push. It almost always means no.":["Kalau seseorang bilang ちょっと…, jangan memaksa. Hampir selalu artinya tidak.","တစ်ယောက်ယောက်က ちょっと… လို့ ပြောရင် ထပ်မတိုက်တွန်းပါနဲ့။ အများအားဖြင့် 'မဖြစ်ဘူး' ဆိုတဲ့ အဓိပ္ပာယ်ပါ။"],

 "I'm fine / No, thank you":["Tidak apa-apa / Tidak usah, terima kasih","ရပါတယ် / မလိုပါဘူး၊ ကျေးဇူးပါ"],
 "Declining an offer in a shop, or saying you're OK":["Menolak tawaran di toko, atau bilang kamu baik-baik saja","ဆိုင်မှာ ငြင်းတဲ့အခါ သို့မဟုတ် ကိုယ်ရပါတယ်လို့ ပြောတဲ့အခါ"],
 "Means 'I'm OK.' In shops, it also means 'No, thank you.'":["Artinya 'Saya baik-baik saja.' Di toko, juga berarti 'Tidak, terima kasih.'","'ရပါတယ်' လို့ အဓိပ္ပာယ်ရပါတယ်။ ဆိုင်မှာဆိုရင် 'မလိုပါဘူး၊ ကျေးဇူးပါ' လို့လည်း အဓိပ္ပာယ်ရပါတယ်။"],
 "Add a small wave of the hand to make 'No thanks' clear.":["Lambaikan tangan sedikit agar 'tidak usah' jadi jelas.","'မလိုပါဘူး' ဆိုတာ ရှင်းအောင် လက်ကို နည်းနည်း ယမ်းပြပါ။"],

 "Calling staff, apologizing, or thanking someone":["Memanggil pelayan, minta maaf, atau berterima kasih","ဝန်ထမ်းကို ခေါ်တဲ့အခါ၊ တောင်းပန်တဲ့အခါ သို့မဟုတ် ကျေးဇူးတင်တဲ့အခါ"],
 "Means 'Excuse me,' 'Sorry' or 'Thank you.'":["Artinya 'Permisi', 'Maaf', atau 'Terima kasih'.","'တစ်ဆိတ်လောက်'၊ 'တောင်းပန်ပါတယ်' ဒါမှမဟုတ် 'ကျေးဇူးပါ' လို့ အဓိပ္ပာယ်ရပါတယ်။"],
 "In restaurants, raise your hand and say すみません! clearly — staff usually won't come unless called.":["Di restoran, angkat tangan dan ucapkan すみません! dengan jelas; pelayan biasanya tidak datang kalau tidak dipanggil.","စားသောက်ဆိုင်မှာ လက်ထောင်ပြီး すみません! လို့ ရှင်းရှင်း ပြောပါ — မခေါ်ရင် ဝန်ထမ်းတွေ များသောအားဖြင့် မလာပါ။"],

 "Sorry I'm late.":["Maaf, saya terlambat.","နောက်ကျလို့ တောင်းပန်ပါတယ်။"],
 "was late (basic form: 遅れる = to be late)":["terlambat (bentuk dasar: 遅れる = terlambat)","နောက်ကျခဲ့ပါတယ် (မူလပုံစံ: 遅れる = နောက်ကျသည်)"],
 "Thank you for going to the trouble.":["Terima kasih sudah repot-repot.","ဒုက္ခခံပေးလို့ ကျေးဇူးတင်ပါတယ်။"],
 "going out of your way":["repot-repot","တကူးတက"],

 "When you understand an explanation":["Saat kamu memahami penjelasan","ရှင်းပြချက်ကို နားလည်တဲ့အခါ"],

 "Careful: なるほど can sound a little casual to a boss or teacher. そうなんですね is safer.":["Hati-hati: なるほど bisa terdengar agak santai kepada atasan atau guru. そうなんですね lebih aman.","သတိ: အထက်လူကြီး သို့မဟုတ် ဆရာကို なるほど လို့ ပြောရင် နည်းနည်း ရင်းနှီးလွန်းတတ်ပါတယ်။ そうなんですね က ပိုစိတ်ချရပါတယ်။"],

 "so that's what it is":["jadi begitu","ဒါကြောင့်ကိုး"],

const SHOW = ["no14-okurete.mp4", "no11-doko.mp4", "no17-kantan.mp4", "no16-naze.mp4", "no12-takai-hikui.mp4"];
const PHRASES = SHOW.map(v => ALL_PHRASES.find(p => p.video === v)).filter(Boolean);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RB = /([々一-鿿]+)\(([぀-ゟー]+)\)/g;           // 漢字(よみ)
const MARK = /\[\[|\]\]|[{}]/g;
const ruby = s => esc(s).replace(RB, "<ruby>$1<rt>$2</rt></ruby>");
const bare = s => s.replace(RB, "$1").replace(MARK, "");                     // 漢字 only, no readings
const yomi = s => s.replace(RB, "$2").replace(MARK, "").replace(/…/g, "");  // reading for speech
const blanked = s => ruby(s.replace(/\[\[.+?\]\]/, "＿＿＿＿").replace(MARK, ""));

let saved = {};
try { saved = JSON.parse(localStorage.getItem("nihongo-clip-note") || "{}") || {}; } catch (e) { saved = {}; }
function save() { try { localStorage.setItem("nihongo-clip-note", JSON.stringify(saved)); } catch (e) {} }

function guessLang() {
  const ls = (navigator.languages || [navigator.language || "en"]).map(x => String(x).toLowerCase());
  for (const l of ls) {
    if (/^zh-(tw|hk|mo)|hant/.test(l)) return "tw";
    if (l.startsWith("zh")) return "cn";
    if (l.startsWith("hi")) return "hi";
    if (l.startsWith("th")) return "th";
    if (l.startsWith("vi")) return "vi";
    if (l.startsWith("fr")) return "fr";
    if (l.startsWith("pt")) return "pt";
    if (l.startsWith("es")) return "es";
    if (l.startsWith("ko")) return "ko";
    if (l.startsWith("ar")) return "ar";
    if (l.startsWith("id") || l.startsWith("in") || l.startsWith("ms")) return "id";
    if (l.startsWith("my")) return "my";
    if (l.startsWith("en")) return "en";
  }
  return "en";
}
const shown = l => SHOW_LANGS.includes(l) ? l : "en";
/* ?lang=id (or my, ko …) in the URL opens the app in that language — handy for sharing */
const urlLang = new URLSearchParams(location.search).get("lang");
let lang = shown(SHOW_LANGS.includes(urlLang) ? urlLang : LANGS.some(l => l[0] === saved.lang) ? saved.lang : guessLang());
const XI = { fr: [XL, 0], pt: [XL, 1], es: [XL, 2], ko: [XL2, 0], ar: [XL2, 1], id: [XL3, 0], my: [XL3, 1] };
const T = o => {
  if (!o) return "";
  if (o[lang] != null) return o[lang];
  const x = XI[lang], r = x && typeof o.en === "string" ? x[0][o.en] : null;
  return r ? r[x[1]] : o.en;
};
const u = k => T(U[k]);

let cur = Number.isInteger(saved.cur) && saved.cur >= 0 && saved.cur < PHRASES.length ? saved.cur : 0;
const EDIT = new URLSearchParams(location.search).has("edit");
const localVideo = {};      // phrase index -> blob URL picked on this device (not saved)
const avail = {};           // phrase index -> true / false once we know whether its MP4 is there
const revealed = new Set(); // dialogue lines whose translation is shown

const videoOf = i => localVideo[i] || (PHRASES[i].video && avail[i] !== false ? PHRASES[i].video : null);
const segOf = (i, j) => {
  const l = saved.timing && saved.timing[i] && saved.timing[i][j];
  if (l && typeof l.s === "number" && typeof l.e === "number" && l.e > l.s) return [l.s, l.e];
  return PHRASES[i].lines[j].t || null;
};

/* turn a Japanese line into HTML with tappable words */
function lineHTML(words, s) {
  return s.split(/(\[\[.+?\]\]|\{.+?\})/).map(seg => {
    if (seg.startsWith("[[")) return `<button type="button" class="w slang">${ruby(seg.slice(2, -2))}</button>`;
    if (seg.startsWith("{")) { const t = seg.slice(1, -1), k = bare(t); return words[k] ? `<button type="button" class="w" data-k="${esc(k)}">${ruby(t)}</button>` : ruby(t); }
    return ruby(seg);
  }).join("");
}
const sayBtns = s => `<button type="button" class="say" data-speak="${esc(yomi(s))}">${esc(u("listen"))}</button><button type="button" class="say" data-speak="${esc(yomi(s))}" data-rate=".65">${esc(u("listenSlow"))}</button>`;

/* ---------- speech (browser's Japanese voice) ---------- */
function speak(text, rate) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const m = new SpeechSynthesisUtterance(text);
  m.lang = "ja-JP"; m.rate = rate || 1;
  const v = speechSynthesis.getVoices().find(x => /^ja/i.test(x.lang));
  if (v) m.voice = v;
  speechSynthesis.speak(m);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-speak]");
  if (b) { e.stopPropagation(); speak(b.dataset.speak, +b.dataset.rate || 1); }
}, true);

/* ---------- learn mode ---------- */
function renderChips() {

}
function renderStage() {

const fmt = x => typeof x === "number" ? x.toFixed(1) + " 秒" : "未設定";
function timingJSON() {
  const out = {};
  PHRASES.forEach((p, i) => { out[p.video || "p" + (i + 1)] = p.lines.map((_, j) => segOf(i, j)); });
  return JSON.stringify(out, null, 1).replace(/\[\n\s+([\d.]+),\n\s+([\d.]+)\n\s+\]/g, "[$1, $2]");
}
function renderBody() {
  const p = PHRASES[cur], hasV = !!videoOf(cur), edit = EDIT && hasV;
  const chat = p.lines.map((l, j) => {
    const seg = segOf(cur, j), tm = (saved.timing && saved.timing[cur] && saved.timing[cur][j]) || {};
    return `
    <div class="line ${l.who === "B" ? "b" : ""}">
      <span class="who" aria-hidden="true">${l.who}</span>
      <div class="bub">
        <p class="jp" lang="ja">${lineHTML(p.words, l.jp)}</p>
        <p class="ro">${esc(l.ro)}</p>
        ${hasV ? `<p class="tr">${esc(T(l.tr))}</p>` : `<p class="tr hid ${revealed.has(j) ? "" : "hide"}" data-j="${j}">${esc(T(l.tr))}</p>`}
        ${hasV && seg ? `<div class="mini"><button type="button" data-play="${j}">${esc(u("line"))}</button><button type="button" data-play="${j}" data-slow="1">${esc(u("slow"))}</button></div>` : ""}
        ${edit ? `<div class="timing" lang="ja">
            <span>開始 <b>${fmt(tm.s)}</b></span><button type="button" data-set="s" data-j="${j}">今の位置</button>
            <span>終了 <b>${fmt(tm.e)}</b></span><button type="button" data-set="e" data-j="${j}">今の位置</button>
          </div>` : ""}
      </div>
    </div>`;
  }).join("");
  const rows = Object.entries(p.words).map(([w, [pos, rd, m]]) =>
    `<tr><td class="wd" lang="ja"><b>${esc(w)}</b>${rd ? `<small>${esc(rd)}</small>` : ""}</td><td class="pos">${esc(T(POS[pos]))}</td><td>${esc(T(m))}</td></tr>`).join("");
  const head = `
      <div class="phrase">
        <span class="tag">PHRASE ${cur + 1} / ${PHRASES.length}</span>
        <div class="ttl"><h2 lang="ja">${ruby(p.jp)}</h2></div>
        <span class="ro">${esc(p.ro)}</span>
        <span class="mean">${esc(T(p.mean))}</span>
      </div>`;
  const talk = `
      <div style="display:flex;flex-direction:column;gap:10px" data-pop>
        <span class="tag">${esc(u(hasV ? "tagV" : "tagN"))}</span>
        ${edit ? `<div class="admin" lang="ja"><span class="tag">編集モード（URLの最後に ?edit を付けた時だけ表示）</span>
          <p class="help">動画を再生して、各行の話し始めで「開始」、話し終わりで「終了」の「今の位置」を押します。一時停止してから押すと正確です。設定はこの端末に保存され、下の欄の内容をコピーして送れば、アプリ本体に組み込めます。</p>
          <textarea readonly id="tjson">${esc(timingJSON())}</textarea>
          <div class="row"><button type="button" class="btn" id="tcopy">設定をコピー</button></div></div>` : ""}
        <div class="chat ${p.solo ? "solo" : ""}">${chat}</div>
        <div class="pop" id="pop" aria-live="polite">${esc(u(hasV ? "popV" : "popN"))}</div>
        ${hasV ? "" : `<div class="row"><button type="button" class="btn" id="showtr">${esc(u("showAll"))}</button></div>`}
      </div>`;
  const words = `<div class="words"><span class="tag">${esc(u("words"))}</span><table>${rows}</table></div>`;
  const exs = (p.examples || []).length ? `
      <div class="examples" data-pop>
        <span class="tag">${esc(u("examples"))}</span>
        ${p.examples.map(x => `<div class="ex">
          <p class="jp" lang="ja">${lineHTML(Object.assign({}, p.words, x.words || {}), x.jp)}</p>
          <p class="ro">${esc(x.ro)}</p>
          <p class="tr">${esc(T(x.tr))}</p>
          ${x.words ? `<p class="exw">${Object.entries(x.words).map(([w, [, , m]]) => `<span><b lang="ja">${esc(w)}</b>${esc(T(m))}</span>`).join("")}</p>` : ""}
        </div>`).join("")}
        <div class="pop" aria-live="polite">${esc(u("exPop"))}</div>
      </div>` : "";
  const tail = `
      <div class="nav">
        <button type="button" class="btn" id="prev" ${cur === 0 ? "disabled" : ""}>${esc(u("prev"))}</button>
        <button type="button" class="btn" id="next" ${cur === PHRASES.length - 1 ? "disabled" : ""}>${esc(u("next"))}</button>
      </div>`;
  /* with a video, the lines, their translation and the word meanings sit right under the video */
  $("cardbody").innerHTML = hasV ? talk + words + exs + head + tail : head + talk + words + exs + tail;
}
function renderCard() { renderStage(); renderBody(); }
function go(i) {
  cur = i; saved.cur = i; save();
  revealed.clear();
  renderChips(); renderCard();
}

let stopAt = null;
function playSeg(t0, t1, slow) {
  const v = $("vid"); if (!v) return;
  v.playbackRate = slow ? 0.6 : 1; v.currentTime = t0; stopAt = t1; v.play().catch(() => {});
}
document.addEventListener("timeupdate", e => {
  const v = e.target; if (v.id === "vid" && stopAt != null && v.currentTime >= stopAt) { v.pause(); stopAt = null; }
}, true);
/* a video file that isn't in the folder yet: fall back to the script view */
document.addEventListener("error", e => {
  const v = e.target;
  /* only "missing / can't play" (code 4) hides the clip; a network hiccup keeps the player so a retry works */
  if (v && v.id === "vid" && !localVideo[cur] && v.error && v.error.code === 4) { avail[cur] = false; renderChips(); renderCard(); }
  else if (v && v.tagName === "VIDEO" && v.closest("#qbody")) v.parentElement.remove();
}, true);
document.addEventListener("loadeddata", e => {
  const v = e.target;
  if (v && v.id === "vid" && !localVideo[cur] && !avail[cur]) { avail[cur] = true; renderChips(); updateTopStats(); }
}, true);

function setTime(j, which) {
  const v = $("vid"); if (!v) return;
  const x = Math.round(v.currentTime * 10) / 10;
  saved.timing = saved.timing || {};
  saved.timing[cur] = saved.timing[cur] || {};
  saved.timing[cur][j] = Object.assign({}, saved.timing[cur][j], { [which]: x });
  save(); renderBody();
}

$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) go(+b.dataset.i); });
$("card").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (e.target.id === "pick") { localVideo[cur] = URL.createObjectURL(f); renderChips(); renderCard(); }
  e.target.value = "";
});
$("card").addEventListener("click", e => {
  const p = PHRASES[cur], t = e.target;
  const w = t.closest(".w");
  if (w) {
    document.querySelectorAll(".w.on").forEach(x => x.classList.remove("on")); w.classList.add("on");
    const box = w.closest("[data-pop]"), pop = (box && box.querySelector(".pop")) || $("pop");
    const all = Object.assign({}, p.words, ...(p.examples || []).map(x => x.words || {}));
    if (w.classList.contains("slang")) {
      pop.innerHTML = `<b lang="ja">${ruby(p.jp)}</b><small>${esc(u("key"))}</small>${esc(T(p.mean))} <button type="button" class="say" data-speak="${esc(yomi(p.jp))}">🔊</button>`;
    } else if (all[w.dataset.k]) {
      const k = w.dataset.k, [pos, rd, m] = all[k];
      pop.innerHTML = `<b lang="ja">${esc(k)}</b>${rd ? `<span lang="ja">（${esc(rd)}）</span> ` : ""}<small>${esc(T(POS[pos]))}</small>${esc(T(m))} <button type="button" class="say" data-speak="${esc(rd || k)}">🔊</button>`;
    }
    return;
  }
  const pb = t.closest("[data-play]");
  if (pb) { const s = segOf(cur, +pb.dataset.play); if (s) playSeg(s[0], s[1], !!pb.dataset.slow); return; }
  const sb = t.closest("[data-set]");
  if (sb) { setTime(+sb.dataset.j, sb.dataset.set); return; }
  const tr = t.closest(".tr.hid");
  if (tr) { const j = +tr.dataset.j; if (revealed.has(j)) revealed.delete(j); else revealed.add(j); tr.classList.toggle("hide"); return; }
  if (t.id === "showtr") { p.lines.forEach((_, j) => revealed.add(j)); document.querySelectorAll("#card .tr.hid").forEach(x => x.classList.remove("hide")); }
  if (t.id === "slowall") playSeg(0, null, true);
  if (t.id === "tcopy") { const a = $("tjson"); a.select(); (navigator.clipboard ? navigator.clipboard.writeText(a.value) : Promise.reject()).catch(() => document.execCommand("copy")); t.textContent = "コピーしました"; }
  if (t.id === "prev" && cur > 0) go(cur - 1);
  if (t.id === "next" && cur < PHRASES.length - 1) go(cur + 1);
});

/* ---------- quiz mode ---------- */
let Q = null;
function newQuiz() {
  const qs = shuffle(PHRASES.map((_, i) => i)).map(i => {
    const type = Math.random() < 0.5 ? "meaning" : "fill";
    const others = shuffle(PHRASES.map((_, k) => k).filter(k => k !== i)).slice(0, 3);
    return { i, type, opts: shuffle([i, ...others]) };
  });
  Q = { qs, n: 0, score: 0, picked: null, missed: [] };
  renderQuiz();
}
function renderQuiz() {
  const box = $("qbody");
  if (!Q) { newQuiz(); return; }
  if (Q.n >= Q.qs.length) return renderResult();
  const q = Q.qs[Q.n], p = PHRASES[q.i], done = Q.picked !== null;
  const keyLine = p.lines.find(l => l.jp.includes("[["));
  const prompt = q.type === "meaning"
    ? `<p class="qtext">${esc(u("qMean"))}</p><p class="qbig" lang="ja">${ruby(p.jp)}</p><p class="ro" style="margin-top:-8px">${esc(p.ro)}</p>`
    : `<p class="qtext">${esc(u("qFill"))}</p>
       <div class="line ${keyLine.who === "B" ? "b" : ""}" style="max-width:100%"><span class="who">${keyLine.who}</span>
       <div class="bub"><p class="jp" lang="ja">${blanked(keyLine.jp)}</p><p class="tr">${esc(T(keyLine.tr))}</p></div></div>`;
  const opts = q.opts.map(k => {
    let cls = "opt" + (q.type === "fill" ? " ja" : "");
    if (done && k === q.i) cls += " right"; else if (done && k === Q.picked) cls += " wrong";
    const label = q.type === "fill" ? `<span lang="ja">${ruby(PHRASES[k].jp)}</span>` : esc(T(PHRASES[k].mean));
    return `<button type="button" class="${cls}" data-k="${k}" ${done ? "disabled" : ""}>${label}</button>`;
  }).join("");
  const v = videoOf(q.i);
  box.innerHTML = `
    <div class="qhead"><span class="tag">QUESTION ${Q.n + 1} / ${Q.qs.length}</span><div class="bar"><span style="width:${Q.n / Q.qs.length * 100}%"></span></div><span class="tag">${esc(u("correct"))} ${Q.score}</span></div>
    ${v ? `<div class="stage" style="border-radius:12px;overflow:hidden"><video src="${esc(v)}" controls playsinline preload="metadata"></video></div>` : ""}
    ${prompt}
    <div class="opts">${opts}</div>
    ${done ? `<div class="fb">${Q.picked === q.i ? `<strong class="ok">${esc(u("ok"))}</strong>` : `<strong class="ng">${esc(u("ng"))}</strong> ${esc(u("ansIs"))} <b lang="ja">${ruby(p.jp)}</b>`}
      <br><span lang="ja">${ruby(p.jp)}</span> ＝ ${esc(T(p.mean))}<br>${esc(T(p.nuance))}</div>
      <div class="row"><button type="button" class="btn main" id="qnext">${esc(u(Q.n + 1 < Q.qs.length ? "nextQ" : "seeRes"))}</button></div>` : ""}`;
}
function renderResult() {
  const best = Math.max(saved.best || 0, Q.score); saved.best = best; save();
  const miss = Q.missed.map(i => `<li><span lang="ja">${ruby(PHRASES[i].jp)}</span><button type="button" class="btn" data-learn="${i}">${esc(u("study"))}</button></li>`).join("");
  $("qbody").innerHTML = `<div class="result">
    <span class="tag">RESULT</span>
    <div class="score">${Q.score}<small> / ${Q.qs.length}</small></div>
    <p style="margin:0">${esc(u(Q.score === Q.qs.length ? "perfect" : "retry"))}　${esc(u("best"))}${best} / ${Q.qs.length}</p>
    ${miss ? `<span class="tag">${esc(u("review"))}</span><ul class="miss">${miss}</ul>` : ""}
    <button type="button" class="btn main" id="qagain">${esc(u("again"))}</button></div>`;
}
$("qbody").addEventListener("click", e => {
  const t = e.target, o = t.closest(".opt");
  if (o && Q.picked === null) {
    const q = Q.qs[Q.n]; Q.picked = +o.dataset.k;
    if (Q.picked === q.i) Q.score++; else Q.missed.push(q.i);
    renderQuiz(); return;
  }
  if (t.id === "qnext") { Q.n++; Q.picked = null; renderQuiz(); }
  if (t.id === "qagain") newQuiz();
  if (t.dataset.learn) { setMode("learn"); go(+t.dataset.learn); }
});

/* ---------- mode switch & display toggles ---------- */
function setMode(m) {
  $("learn").hidden = m !== "learn"; $("quiz").hidden = m !== "quiz";
  $("m-learn").setAttribute("aria-pressed", m === "learn"); $("m-quiz").setAttribute("aria-pressed", m === "quiz");
  saved.mode = m; save();
  if (m === "quiz") renderQuiz();
}
$("m-learn").addEventListener("click", () => setMode("learn"));
$("m-quiz").addEventListener("click", () => setMode("quiz"));
function applyToggles() {
  const furi = saved.furi !== false, ro = saved.ro !== false;
  document.body.classList.toggle("nofuri", !furi); document.body.classList.toggle("noro", !ro);
  $("tg-furi").setAttribute("aria-pressed", furi); $("tg-ro").setAttribute("aria-pressed", ro);
}
$("tg-furi").addEventListener("click", () => { saved.furi = saved.furi === false; save(); applyToggles(); });
$("tg-ro").addEventListener("click", () => { saved.ro = saved.ro === false; save(); applyToggles(); });

/* ---------- language ---------- */
const langOptions = SHOW_LANGS.map(id => LANGS.find(x => x[0] === id)).map(([id, name, h]) => `<option value="${id}" lang="${h}">${name}</option>`).join("");
$("langsel").innerHTML = langOptions;
$("t-langsel").innerHTML = langOptions;
function setLang(l) {
  lang = l; saved.lang = l; save();
  document.documentElement.lang = LANGS.find(x => x[0] === l)[2];
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-u]").forEach(el => { el.textContent = u(el.dataset.u); });
  $("langsel").value = l; $("t-langsel").value = l;
  renderTicker(); renderChips(); renderCard();
  if (!$("quiz").hidden && Q) renderQuiz();
}
$("langsel").addEventListener("change", e => setLang(e.target.value));
$("t-langsel").addEventListener("change", e => setLang(e.target.value));

/* ---------- top page ---------- */
function renderTicker() {
  const html = PHRASES.map((p, i) => `<button type="button" class="tk ${avail[i] ? "v" : ""}" data-i="${i}"><i>${i + 1}</i><b lang="ja">${esc(bare(p.jp))}</b><small>${esc(T(p.mean))}</small></button>`).join("");
  $("t-track").innerHTML = html + html.replace(/<button /g, '<button tabindex="-1" aria-hidden="true" ');
}
function updateTopStats() {
  $("t-np").textContent = PHRASES.length;
  $("t-nv").textContent = PHRASES.filter((_, i) => avail[i]).length;
}
/* the top page background clip (owner's choice). top-video.mp4 = D:\00013.MTS converted to 720p.
   Earlier: no11-doko.mp4, top-omikoshi.mp4, top-00034-omikoshi.mp4 — the last two are kept in 待機中の動画. */
const BG_VIDEO = "top-video.mp4";
function nextBg() {
  const v = $("bgv");
  if (v.src || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  v.loop = true; v.src = BG_VIDEO; v.play().catch(() => {});
}
function showTop(on) {
  $("top").hidden = !on; $("app").hidden = on;
  const v = $("bgv");
  if (on) { if (!v.src) nextBg(); else v.play().catch(() => {}); } else v.pause();
  scrollTo(0, 0);
}
$("t-start").addEventListener("click", () => { setMode("learn"); showTop(false); });
$("t-quiz").addEventListener("click", () => { setMode("quiz"); newQuiz(); showTop(false); });
$("t-track").addEventListener("click", e => { const b = e.target.closest(".tk"); if (b) { setMode("learn"); go(+b.dataset.i); showTop(false); } });
$("tohome").addEventListener("click", () => showTop(true));

/* find out which MP4s are in the folder (on a web server; opened as a plain file, the player's own error decides).
   One request at a time, and only a real "not found" counts as missing: a busy or refused answer leaves it to the player. */
async function probeVideos() {
  for (let i = 0; i < PHRASES.length; i++) {
    const p = PHRASES[i];
    if (!p.video) { avail[i] = false; continue; }
    try {
      const r = await fetch(p.video, { method: "HEAD", cache: "no-store" });
      if (r.ok) avail[i] = true; else if (r.status === 404 || r.status === 410) avail[i] = false;
    } catch (e) { /* unknown */ }
  }
  updateTopStats(); renderTicker(); renderChips(); renderCard();
  if (!$("top").hidden && !$("bgv").src) nextBg();
}

/* ---------- start ---------- */
applyToggles();
setLang(lang);
setMode(saved.mode === "quiz" ? "quiz" : "learn");
updateTopStats();
/* ?learn opens straight on the learn screen (handy for sharing a lesson or taking screenshots) */
showTop(!EDIT && !new URLSearchParams(location.search).has("learn"));
probeVideos();

/* ---------- FREE download = install the PWA ---------- */
let installEvt = null;
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
addEventListener("appinstalled", () => { installEvt = null; $("t-dl").hidden = true; });
if (isStandalone()) $("t-dl").hidden = true;
function installSteps() {
  const ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const k = ios ? "ios" : /Android/.test(ua) ? "android" : "desktop";
  return `<ol>${u(k).map(s => `<li>${s}</li>`).join("")}</ol>`;
}
$("t-dl").addEventListener("click", async () => {
  if (installEvt) {
    installEvt.prompt();
    try { const r = await installEvt.userChoice; if (r.outcome === "accepted") $("t-dl").hidden = true; } catch (e) {}
    installEvt = null; return;
  }
  $("t-steps").innerHTML = installSteps(); $("t-sheet").hidden = false; $("t-sheet-x").focus();
});
$("t-sheet-x").addEventListener("click", () => { $("t-sheet").hidden = true; });
$("t-sheet").addEventListener("click", e => { if (e.target.id === "t-sheet") $("t-sheet").hidden = true; });
addEventListener("keydown", e => { if (e.key === "Escape") $("t-sheet").hidden = true; });
</script>

<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body></html>
